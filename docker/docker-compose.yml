# Sakura AI 开发模式 Compose（挂载源码、host 网络、仅 Web 服务）
# 生产部署请使用 docker-compose.prod.yml（Web + MySQL + Redis 一键启动，无需源码）
services:
  # Web应用
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sakura-ai
    container_name: sakura-ai
    restart: unless-stopped
    network_mode: host  # 使用宿主机网络,可直接访问 localhost
    env_file:
      - ../.deploy/deployment.env
    group_add:
      - "9472"
      # sandboxd owns this independent IPC group.  It is deliberately not
      # the Host Updater group (9472).
      - "9473"
    environment:
      AGENT_TEAM_SANDBOX_RUNTIME: ${SAKURA_SANDBOX_RUNTIME:-docker}
      AGENT_TEAM_SANDBOX_RUNNER_IMAGE_DIGEST: ${SAKURA_AGENT_RUNNER_IMAGE_DIGEST:-}
      AGENT_TEAM_SANDBOX_EXPECTED_INSTANCE_ID: ${SAKURA_SANDBOX_INSTANCE_ID:-}
      # Standalone source Compose must remain usable without start.sh having
      # exported an interpolation variable.  Compose exposes the invocation
      # directory as PWD; using it for both fields keeps the Web admission
      # identity byte-for-byte equal to the host bind source and, unlike the
      # old ../workplace fallback, always provides an absolute path.
      AGENT_TEAM_SANDBOX_EXPECTED_WORKSPACE_ROOT: ${SAKURA_SANDBOX_WORKSPACE_ROOT:-${PWD}/workplace}
    volumes:
      - type: bind
        source: /run/sakura-ai
        target: /run/sakura-ai
        read_only: true
      - type: bind
        source: /run/sakura-ai-sandbox
        target: /run/sakura-ai-sandbox
        read_only: true
      - ../logs:/app/logs
      - ../config:/app/config  # 存放 Setup Wizard 写入的 connection.json
      - ../backend:/app/backend  # 开发模式：挂载 backend 代码目录
      - ../requirements.txt:/app/requirements.txt  # 挂载依赖文件，支持热更新
      - type: bind
        source: ${SAKURA_SANDBOX_WORKSPACE_ROOT:-${PWD}/workplace}
        target: /app/workplace  # Agent 专家团队独立工作区
      - ../Skills:/app/Skills  # Agent Skills 技能目录持久化
      - chroma_data:/app/data/chroma  # ChromaDB 向量数据库持久化
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ChromaDB 向量数据库持久化卷
volumes:
  chroma_data:
    driver: local
