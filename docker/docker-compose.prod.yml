# Sakura AI 生产部署 — Web + MySQL 8.4 + Redis 一键启动
# SAKURA_DB_PASSWORD 必须来自 .deploy/deployment.env（由 start.sh 首次 --prod
# 原子生成并以 0600 保存）。缺失时 Compose 直接 fail-closed；不要把运行时
# deployment.env 提交到 Git。
# 固定镜像版本由 .deploy/deployment.env 中的 SAKURA_AI_IMAGE 指定：
#   docker compose --env-file <deployment_env> --project-name <project> -f docker-compose.prod.yml up -d
services:
  web:
    image: ${SAKURA_AI_IMAGE:-ghcr.io/sakura520222/sakura-ai:latest}
    container_name: sakura-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.deploy/deployment.env
    group_add:
      - "9472"
      # sandboxd owns this independent IPC group.  It is deliberately not
      # the Host Updater group (9472).
      - "9473"
    environment:
      DATABASE_URL: mysql+asyncmy://sakura:${SAKURA_DB_PASSWORD:?SAKURA_DB_PASSWORD must be set}@mysql:3306/sakura_ai
      REDIS_URL: redis://redis:6379/0
      AGENT_TEAM_SANDBOX_RUNTIME: ${SAKURA_SANDBOX_RUNTIME:-docker}
      AGENT_TEAM_SANDBOX_RUNNER_IMAGE_DIGEST: ${SAKURA_AGENT_RUNNER_IMAGE_DIGEST:-}
      AGENT_TEAM_SANDBOX_EXPECTED_INSTANCE_ID: ${SAKURA_SANDBOX_INSTANCE_ID:-}
      AGENT_TEAM_SANDBOX_EXPECTED_WORKSPACE_ROOT: ${SAKURA_SANDBOX_WORKSPACE_ROOT:?SAKURA_SANDBOX_WORKSPACE_ROOT must be provided by start.sh}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - type: bind
        source: /run/sakura-ai
        target: /run/sakura-ai
        read_only: true
      - type: bind
        source: /run/sakura-ai-sandbox
        target: /run/sakura-ai-sandbox
        read_only: true
      - config_data:/app/config
      - chroma_data:/app/data/chroma
      - logs_data:/app/logs
      # Production workspaces are controlled host paths.  sandboxd mounts the
      # same absolute host root for the one task it is executing; a named
      # volume would hide the source path from the host Docker daemon.
      - type: bind
        source: ${SAKURA_SANDBOX_WORKSPACE_ROOT:?SAKURA_SANDBOX_WORKSPACE_ROOT must be provided by start.sh}
        target: /app/workplace
      - skills_data:/app/Skills
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mysql:
    image: mysql:8.4
    container_name: sakura-ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sakura_ai
      MYSQL_USER: sakura
      MYSQL_PASSWORD: ${SAKURA_DB_PASSWORD:?SAKURA_DB_PASSWORD must be set}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-redo-log-capacity=32M
      - --max-connections=40
      - --mysqlx=OFF
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysql --protocol=TCP -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" -D "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: sakura-ai-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  config_data:
  chroma_data:
  logs_data:
  skills_data:
