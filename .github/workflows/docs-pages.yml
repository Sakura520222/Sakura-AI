name: Docs · VitePress build

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-pages.yml'
  push:
    branches: [develop, main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sakura-ai-docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install VitePress
        run: npm ci --prefix docs --no-audit --no-fund

      - name: Build static site
        run: npm run build --prefix docs -- --base /
