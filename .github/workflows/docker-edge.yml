name: Docker development 镜像

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      confirm_branch:
        description: "必须为 develop 分支手动运行"
        required: true
        type: string

concurrency:
  group: docker-development
  cancel-in-progress: false  # serialize the final manifest/head commit

permissions:
  contents: read
  packages: write

jobs:
  publish-edge:
    name: 发布 development 镜像
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || inputs.confirm_branch == 'develop')
    uses: ./.github/workflows/docker-publish.yml
    with:
      source_ref: ${{ github.sha }}   # 必须用不可变 SHA，不能传 main
      channel: development
      sync_dockerhub: false
    secrets: inherit

  publish-sandbox-edge:
    name: 发布 development Agent sandbox 镜像
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || inputs.confirm_branch == 'develop')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/sandbox-publish.yml
    with:
      source_ref: ${{ github.sha }}
      channel: development
    secrets: inherit

  publish-deployment:
    name: Publish complete development deployment
    needs: [publish-edge, publish-sandbox-edge]
    outputs:
      digest: ${{ steps.deployment.outputs.digest }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: imjasonh/setup-crane@v0.7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify all components, publish manifest, then advance edge
        id: deployment
        env:
          PYTHONPATH: updater/src
          DEPLOYMENT_TAG: ${{ needs.publish-edge.outputs.immutable_tag }}
          WEB_DIGEST: ${{ needs.publish-edge.outputs.digest }}
          SANDBOXD_DIGEST: ${{ needs.publish-sandbox-edge.outputs.sandboxd_digest }}
          RUNNER_DIGEST: ${{ needs.publish-sandbox-edge.outputs.runner_digest }}
        run: |
          digest=$(python scripts/publish_development_deployment.py)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  sync-dockerhub:
    name: Mirror the committed deployment to Docker Hub
    needs: [publish-edge, publish-deployment]
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DEPLOYMENT_TAG: ${{ needs.publish-edge.outputs.immutable_tag }}
      DEPLOYMENT_DIGEST: ${{ needs.publish-deployment.outputs.digest }}
    steps:
      - uses: imjasonh/setup-crane@v0.7
      - name: Copy the verified manifest before advancing the mirror head
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "Docker Hub credentials unavailable; skipping optional mirror"
            exit 0
          fi
          echo "$DOCKERHUB_TOKEN" | crane auth login -u "$DOCKERHUB_USERNAME" --password-stdin docker.io
          crane copy "ghcr.io/sakura520222/sakura-ai@${DEPLOYMENT_DIGEST}" "docker.io/sakura520222/sakura-ai:${DEPLOYMENT_TAG}"
          crane tag "docker.io/sakura520222/sakura-ai:${DEPLOYMENT_TAG}" edge
