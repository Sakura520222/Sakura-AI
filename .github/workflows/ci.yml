name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

jobs:
  python-quality:
    name: Python 质量检查
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e './updater[dev]'
          pip install ruff pytest pytest-asyncio

      - name: Ruff 检查
        run: ruff check .

      - name: 运行测试
        run: pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}

  updater-quality:
    name: Updater 质量检查
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: updater/pyproject.toml

      - name: 安装 updater 依赖
        run: pip install -e './updater[dev]' ruff

      - name: Ruff updater 检查
        run: ruff check updater

      - name: 运行 updater 测试
        run: |
          pytest updater/tests -q
          pytest updater/tests/test_build_config.py -q

  windows-uv-smoke:
    name: Windows uv 冒烟测试
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7

      - name: 同步锁定依赖
        run: uv sync --locked

      - name: 导入主后端模块
        run: uv run --no-sync python -c "import backend.main; print('backend import ok')"
