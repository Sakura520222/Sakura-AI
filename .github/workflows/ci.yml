name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

jobs:
  python-quality:
    name: Python 质量检查
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            updater/pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff 检查
        run: ruff check .

      - name: 运行测试
        run: pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}

  updater-quality:
    name: Updater 质量检查
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: updater/pyproject.toml

      - name: 安装 updater 依赖
        run: pip install -e './updater[dev]' ruff

      - name: Ruff updater 检查
        run: ruff check updater

      - name: 运行 updater 测试
        run: |
          pytest updater/tests -q
          pytest updater/tests/test_build_config.py -q

  windows-uv-smoke:
    name: Windows uv 冒烟测试
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7

      - name: 同步锁定依赖
        run: uv sync --locked

      - name: 导入主后端模块
        run: uv run --no-sync python -c "import backend.main; print('backend import ok')"

      - name: Ruff 检查
        run: uv run --no-sync ruff check .

      - name: 运行完整测试
        run: uv run --no-sync pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}

  settings-databases:
    name: Settings database (${{ matrix.engine }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mysql
            image: mysql:8.4
            driver: mysql+asyncmy
            user: root
            port: 3306
            health: mysqladmin ping --silent
          - engine: postgresql
            image: postgres:17
            driver: postgresql+asyncpg
            user: postgres
            port: 5432
            health: pg_isready -U postgres
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_DATABASE: settings_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: settings_test
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Verify transactions and independent writers on the server dialect
        run: uv run --no-sync pytest tests/test_config_center.py -q
        env:
          SAKURA_CONFIG_TEST_DATABASE_URL: ${{ matrix.driver }}://${{ matrix.user }}:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:${{ matrix.port }}/settings_test
