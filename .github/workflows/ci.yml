name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

jobs:
  python-quality:
    name: Python 质量检查
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Ruff 检查
        run: ruff check .

      - name: 运行测试
        run: pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}
