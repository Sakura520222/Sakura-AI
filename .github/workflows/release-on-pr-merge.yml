name: main 推送自动发布 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # 排队执行，避免后续 main push 取消进行中的稳定镜像发布

jobs:
  generate-release:
    name: 生成 Release 说明
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.read_version.outputs.current_version }}
      release_exists: ${{ steps.check_release.outputs.exists }}
      release_action: ${{ steps.create_or_update_release.outputs.release_action }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.MY_RELEASE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true  # 拉取全部 tag，供 compute_base 列版本号
          ref: main  # 显式指定 main 分支，避免处于 PR ref 导致 push 失败

      - name: 读取当前版本
        id: read_version
        run: |
          # 读取 backend/__init__.py 中的当前版本号（Python 代码版本号单一来源）
          if [ -f backend/__init__.py ]; then
            CURRENT_VERSION=$(
              sed -n 's/^__version__[[:space:]]*=[[:space:]]*"\([0-9.]*\)".*/\1/p' backend/__init__.py | head -n 1
            )

            # 如果未能解析出版本号则直接失败，避免创建错误 tag（如 v）
            if [ -z "$CURRENT_VERSION" ]; then
              echo "无法从 backend/__init__.py 解析版本号，请检查 __version__ 定义格式是否正确。" >&2
              exit 1
            fi
          else
            echo "❌ 错误: backend/__init__.py 文件不存在"
            exit 1
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "backend/__init__.py 当前版本: $CURRENT_VERSION"

          # 获取今天日期
          TODAY=$(date +'%Y-%m-%d')
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "今天日期: $TODAY"

      - name: 计算 notes 基准点 BASE
        id: compute_base
        run: |
          VERSION="${{ steps.read_version.outputs.current_version }}"
          # 只在严格版本号 tag 中选取 BASE，避免 latest / stable 等非版本 tag 干扰排序
          BASE=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | grep -vE "^v${VERSION}$" | head -n1)
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          if [ -n "$BASE" ]; then
            echo "notes 范围: ${BASE}..HEAD"
          else
            echo "notes 范围: 首个 commit 起（无上一版本 tag）"
          fi

      - name: 检查 Release 是否存在
        id: check_release
        run: |
          VERSION="${{ steps.read_version.outputs.current_version }}"
          TAG_NAME="v${VERSION}"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Release $TAG_NAME 已存在，将刷新说明与附件"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Release $TAG_NAME 不存在，将创建新 Release"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.MY_RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: 检查 LLM 配置
        id: check_llm
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          if [ -n "$LLM_BASE_URL" ] && [ -n "$LLM_API_KEY" ] && [ -n "$LLM_MODEL" ]; then
            echo "has_llm=true" >> "$GITHUB_OUTPUT"
            echo "LLM 已配置，将尝试 AI 路径"
          else
            echo "has_llm=false" >> "$GITHUB_OUTPUT"
            echo "LLM 未配置，跳过 Python 安装，直接走 bash 降级路径"
          fi

      - name: 设置 Python 3.14
        if: steps.check_llm.outputs.has_llm == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: AI 生成 Release 说明
        id: ai_notes
        if: steps.check_llm.outputs.has_llm == 'true'
        continue-on-error: true
        shell: bash
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          VERSION: ${{ steps.read_version.outputs.current_version }}
          DATE: ${{ steps.read_version.outputs.today }}
          BASE: ${{ steps.compute_base.outputs.base }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request


          def emit(key: str, value: str) -> None:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"{key}={value}\n")


          def fail_fallback(reason: str) -> None:
              print(f"AI 路径降级到 bash 分组: {reason}")
              emit("fallback", "true")
              sys.exit(0)


          # 1. 校验 secrets
          base_url = os.environ.get("LLM_BASE_URL", "").rstrip("/")
          api_key = os.environ.get("LLM_API_KEY", "")
          model = os.environ.get("LLM_MODEL", "")
          if not base_url or not api_key or not model:
              fail_fallback("LLM_BASE_URL / LLM_API_KEY / LLM_MODEL 任一未配置")

          # 2. 读取版本、日期、提交标题列表
          version = os.environ["VERSION"]
          date = os.environ["DATE"]
          base = os.environ.get("BASE", "").strip()
          rev_range = f"{base}..HEAD" if base else "HEAD"
          result = subprocess.run(
              ["git", "log", "--pretty=format:%s", rev_range],
              check=True,
              capture_output=True,
              text=True,
          )
          commits = [c for c in result.stdout.splitlines() if c.strip()]
          if not commits:
              fail_fallback("提交列表为空")

          commit_block = "\n".join(commits)

          # 3. 构造 prompt（固定类型枚举顺序、禁 emoji、要求严格 JSON）
          system_prompt = (
              "你是一个发布说明撰写助手。只依据用户给出的 Conventional Commits 提交标题列表，"
              "撰写中英双语发布说明。禁止捏造未出现的变更。全程不得使用 emoji。"
              "输出严格 JSON（不要 markdown 代码围栏），结构为："
              '{"summary_zh": string, "summary_en": string, '
              '"groups": [{"title_zh": string, "title_en": string, '
              '"items": [{"zh": string, "en": string}]}]}。'
              "类型分组使用固定枚举并按此顺序：feat(新增功能/New Features)、"
              "fix(问题修复/Bug Fixes)、perf(性能优化/Performance)、"
              "refactor(重构/Refactor)、docs(文档更新/Documentation)、"
              "test(测试/Tests)、i18n(国际化/Internationalization)、"
              "build/ci/chore/style 归入「其他变更/Other Changes」。"
              "无内容的类型省略。每个条目必须同时给出中文与英文。"
              "合并语义重复或琐碎的 chore/ci 条目，保留具体描述，不要泛化为「若干维护任务」。"
          )
          user_prompt = (
              f"版本号: {version}\n日期: {date}\n\n"
              f"提交标题列表（每行一条）：\n{commit_block}"
          )

          payload = {
              "model": model,
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_prompt},
              ],
              "temperature": 0.3,
              "reasoning_effort": "max",
              "max_tokens": 131072,
              "stream": False,
          }
          body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          url = f"{base_url}/chat/completions"
          headers = {
              "Authorization": f"Bearer {api_key}",
              "Content-Type": "application/json",
          }

          # 4. 请求（最多重试 2 次，指数退避）
          last_err: Exception | None = None
          content: str | None = None
          for attempt in range(3):  # 初次 + 2 次重试
              try:
                  req = urllib.request.Request(
                      url, data=body, headers=headers, method="POST"
                  )
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                  content = data["choices"][0]["message"]["content"]
                  break
              except Exception as e:  # noqa: BLE001
                  last_err = e
                  if attempt < 2:
                      time.sleep(2 ** attempt)  # 1s, 2s
          if content is None:
              fail_fallback(f"API 请求失败: {last_err}")

          # 5. 解析 content 为 JSON（兼容模型擅自加的代码围栏）
          def extract_json(text: str) -> str:
              text = text.strip()
              if text.startswith("```"):
                  lines = text.splitlines()
                  if lines and lines[0].startswith("```"):
                      lines = lines[1:]
                  if lines and lines[-1].startswith("```"):
                      lines = lines[:-1]
                  text = "\n".join(lines).strip()
              return text

          try:
              obj = json.loads(extract_json(content))
          except Exception as e:  # noqa: BLE001
              fail_fallback(
                  f"JSON 解析失败: {e}; 原始内容前 200 字: {content[:200]!r}"
              )

          # 6. 校验字段
          summary_zh = (obj.get("summary_zh") or "").strip()
          summary_en = (obj.get("summary_en") or "").strip()
          raw_groups = obj.get("groups")
          if not isinstance(raw_groups, list):
              fail_fallback("groups 字段非数组")
          if not summary_zh or not summary_en or not raw_groups:
              fail_fallback("summary_zh / summary_en / groups 字段缺失")

          norm_groups: list[dict] = []
          for g in raw_groups:
              tz = (g.get("title_zh") or "").strip()
              te = (g.get("title_en") or "").strip()
              raw_items = g.get("items") or []
              if not tz or not te or not raw_items:
                  continue
              norm_items: list[tuple[str, str]] = []
              for it in raw_items:
                  iz = (it.get("zh") or "").strip()
                  ie = (it.get("en") or "").strip()
                  if iz and ie:  # 条目必须同时具备中英
                      norm_items.append((iz, ie))
              if norm_items:
                  norm_groups.append(
                      {"title_zh": tz, "title_en": te, "items": norm_items}
                  )
          if not norm_groups:
              fail_fallback("解析后无有效分组")

          # 7. 按固定枚举顺序重排（稳定排序，未匹配项放最后）
          order_en = [
              "New Features",
              "Bug Fixes",
              "Performance",
              "Refactor",
              "Documentation",
              "Tests",
              "Internationalization",
              "Other Changes",
          ]

          def rank(title_en: str) -> int:
              try:
                  return order_en.index(title_en)
              except ValueError:
                  return len(order_en)

          norm_groups.sort(key=lambda g: rank(g["title_en"]))

          # 8. 拼装最终 Markdown（§3.4：两个折叠块，全程无 emoji）
          lines: list[str] = []
          lines.append(f"## v{version} ({date})")
          lines.append("")
          lines.append("### 总结 / Summary")
          lines.append("")
          lines.append(summary_zh)
          lines.append("")
          lines.append(summary_en)
          lines.append("")
          lines.append("<details>")
          lines.append("<summary>中文更新日志</summary>")
          lines.append("")
          for g in norm_groups:
              lines.append(f"#### {g['title_zh']}")
              for iz, _ie in g["items"]:
                  lines.append(f"- {iz}")
              lines.append("")
          lines.append("</details>")
          lines.append("")
          lines.append("<details>")
          lines.append("<summary>English Changelog</summary>")
          lines.append("")
          for g in norm_groups:
              lines.append(f"#### {g['title_en']}")
              for _iz, ie in g["items"]:
                  lines.append(f"- {ie}")
              lines.append("")
          lines.append("</details>")
          lines.append("")

          with open("release_notes.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))

          print("AI 路径成功生成 release_notes.txt")
          emit("fallback", "false")
          print("--- release_notes.txt ---")
          print("\n".join(lines))
          PY

      - name: 生成 Release 描述（降级 - Conventional Commits 分组）
        id: generate_release_notes
        if: ${{ steps.ai_notes.outcome != 'success' || steps.ai_notes.outputs.fallback == 'true' }}
        shell: bash
        env:
          VERSION: ${{ steps.read_version.outputs.current_version }}
          TODAY: ${{ steps.read_version.outputs.today }}
          BASE: ${{ steps.compute_base.outputs.base }}
        run: |
          set -e

          # 类型→组 key 映射（style 归入其他变更，与 §3.3 一致）
          declare -A PREFIX_GROUP=(
            ["feat"]="feat" ["fix"]="fix" ["perf"]="perf"
            ["refactor"]="refactor" ["docs"]="docs" ["test"]="test"
            ["i18n"]="i18n"
            ["build"]="chore" ["ci"]="chore" ["chore"]="chore" ["style"]="chore"
          )
          declare -A GROUP_ZH=(
            ["feat"]="新增功能" ["fix"]="问题修复" ["perf"]="性能优化"
            ["refactor"]="重构" ["docs"]="文档更新" ["test"]="测试"
            ["i18n"]="国际化" ["chore"]="其他变更"
          )
          declare -A GROUP_EN=(
            ["feat"]="New Features" ["fix"]="Bug Fixes" ["perf"]="Performance"
            ["refactor"]="Refactor" ["docs"]="Documentation" ["test"]="Tests"
            ["i18n"]="Internationalization" ["chore"]="Other Changes"
          )
          # 固定枚举顺序
          GROUP_ORDER=("feat" "fix" "perf" "refactor" "docs" "test" "i18n" "chore")

          # 取 BASE..HEAD 提交标题（BASE 为空则全部）
          COMMITS_FILE="${RUNNER_TEMP}/commit_subjects.txt"
          git log --pretty=format:"%s" ${BASE:+$BASE..}HEAD > "$COMMITS_FILE"

          # 解析提交，按组归类
          declare -A NEW_COMMITS
          TOTAL=0
          while IFS= read -r commit; do
            [ -z "$commit" ] && continue
            # 提取 Conventional Commits 前缀（小写）
            prefix=$(echo "$commit" | sed -E 's/^([a-zA-Z]+)(\([^)]*\))?!?:.*/\1/' | tr '[:upper:]' '[:lower:]')
            group="${PREFIX_GROUP[$prefix]:-chore}"
            NEW_COMMITS[$group]="${NEW_COMMITS[$group]}- ${commit}"$'\n'
            TOTAL=$((TOTAL + 1))
          done < "$COMMITS_FILE"

          # 收集涉及的类型（中文顿号 / 英文逗号）
          ZH_TITLES=""
          EN_TITLES=""
          for g in "${GROUP_ORDER[@]}"; do
            if [ -n "${NEW_COMMITS[$g]}" ]; then
              if [ -n "$ZH_TITLES" ]; then
                ZH_TITLES="${ZH_TITLES}、${GROUP_ZH[$g]}"
                EN_TITLES="${EN_TITLES}, ${GROUP_EN[$g]}"
              else
                ZH_TITLES="${GROUP_ZH[$g]}"
                EN_TITLES="${GROUP_EN[$g]}"
              fi
            fi
          done

          if [ "$TOTAL" -eq 0 ]; then
            ZH_TITLES="无"
            EN_TITLES="none"
          fi

          # 拼装 Markdown（无折叠、双语并排标题、条目为 commit 原文、无 emoji）
          {
            echo "## v${VERSION} (${TODAY})"
            echo ""
            echo "### 总结 / Summary"
            echo ""
            echo "本次发布包含 ${TOTAL} 项提交，涉及：${ZH_TITLES}。"
            echo ""
            echo "This release includes ${TOTAL} commits across: ${EN_TITLES}."
            echo ""

            for g in "${GROUP_ORDER[@]}"; do
              commits="${NEW_COMMITS[$g]}"
              if [ -n "$commits" ]; then
                echo "### ${GROUP_ZH[$g]} / ${GROUP_EN[$g]}"
                echo ""
                printf '%s\n' "$commits"
                echo ""
              fi
            done
          } > release_notes.txt

          echo "降级路径（bash 分组）已生成 release_notes.txt"
          echo "--- release_notes.txt ---"
          cat release_notes.txt

      - name: 创建或更新 Release
        id: create_or_update_release
        run: |
          VERSION="${{ steps.read_version.outputs.current_version }}"
          TAG_NAME="v${VERSION}"
          EXISTS="${{ steps.check_release.outputs.exists }}"

          if [ "$EXISTS" = "false" ]; then
            echo "📝 正在创建 Release ${TAG_NAME}..."
            gh release create "$TAG_NAME" \
              --title "Release ${TAG_NAME}" \
              --notes-file release_notes.txt \
              --latest
            echo "✅ Release ${TAG_NAME} 已创建"
            echo "release_action=created" >> $GITHUB_OUTPUT
          else
            echo "📝 正在更新 Release ${TAG_NAME}..."
            gh release edit "$TAG_NAME" \
              --notes-file release_notes.txt
            echo "✅ Release ${TAG_NAME} 已更新"
            echo "release_action=updated" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.MY_RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: 生成 Release 说明预览摘要
        if: always()
        shell: bash
        run: |
          VERSION="${{ steps.read_version.outputs.current_version }}"
          ACTION="${{ steps.create_or_update_release.outputs.release_action }}"
          {
            echo "# Release v${VERSION} 说明"
            echo ""
            echo "- 操作: ${ACTION:-未知}"
            echo "- 标签: v${VERSION}"
            echo "- 发布页面: https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"
            echo ""
            if [ -f release_notes.txt ]; then
              echo "<details><summary>release_notes.txt 预览</summary>"
              echo ""
              echo '```markdown'
              cat release_notes.txt
              echo '```'
              echo ""
              echo "</details>"
            else
              echo "release_notes.txt 未生成（AI 与降级路径均未产出）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 清理临时文件
        if: always()
        run: |
          rm -f release_notes.txt 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/commit_subjects.txt" 2>/dev/null || true
          echo "✅ 临时文件已清理"

  build-and-upload-assets:
    name: 打包并上传附件
    runs-on: ubuntu-latest
    needs: generate-release
    if: always() && needs.generate-release.result == 'success'
    permissions:
      contents: write

    steps:
      - name: 检出不可变发布 Tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: refs/tags/v${{ needs.generate-release.outputs.version }}

      - name: 验证项目结构
        run: |
          # 验证后端版本文件和主文件
          if [ ! -f "backend/__init__.py" ]; then
            echo "❌ 错误: backend/__init__.py 文件不存在"
            exit 1
          fi

          if [ ! -f "backend/main.py" ]; then
            echo "❌ 错误: backend/main.py 文件不存在"
            exit 1
          fi

          # 验证依赖文件
          if [ ! -f "requirements.txt" ]; then
            echo "❌ 错误: requirements.txt 文件不存在"
            exit 1
          fi

          # 验证核心目录结构
          if [ ! -d "backend/core" ]; then
            echo "❌ 错误: backend/core 目录不存在"
            exit 1
          fi

          if [ ! -d "backend/api" ]; then
            echo "❌ 错误: backend/api 目录不存在"
            exit 1
          fi

          if [ ! -d "backend/services" ]; then
            echo "❌ 错误: backend/services 目录不存在"
            exit 1
          fi

          # 验证配置文件
          if [ ! -f "config/strategies.yaml" ]; then
            echo "❌ 错误: config/strategies.yaml 文件不存在"
            exit 1
          fi

          # 验证 Docker 配置
          if [ ! -f "docker/Dockerfile" ]; then
            echo "❌ 错误: docker/Dockerfile 文件不存在"
            exit 1
          fi

          if [ ! -f "docker/docker-compose.yml" ]; then
            echo "❌ 错误: docker/docker-compose.yml 文件不存在"
            exit 1
          fi

          echo "✅ Sakura-AI 项目结构验证通过"

      - name: 获取版本信息
        id: get_version
        run: |
          VERSION="${{ needs.generate-release.outputs.version }}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v${VERSION}" >> $GITHUB_OUTPUT
          echo "当前版本: ${VERSION}"

      - name: 等待 Release 创建并验证 Tag
        id: verify_tag
        run: |
          TAG_NAME="${{ steps.get_version.outputs.TAG_NAME }}"

          echo "⏳ 等待 Release 创建完成..."

          # 等待最多 30 秒，确保 Release 创建完成
          MAX_RETRIES=6
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # 检查 Tag 是否已经生效
            if git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}$"; then
              echo "✅ Tag ${TAG_NAME} 已确认存在"
              echo "tag_verified=true" >> $GITHUB_OUTPUT
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ 等待 Tag 生效... ($RETRY_COUNT/$MAX_RETRIES)"
            sleep 5
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ 错误: Tag ${TAG_NAME} 未能在预期时间内生效"
            echo "tag_verified=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # 验证 Release 是否存在
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "❌ 错误: Release ${TAG_NAME} 不存在"
            exit 1
          fi

          echo "✅ Release ${TAG_NAME} 已确认存在"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 检查并清理 Release 附件状态
        id: check_assets
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          TAG_NAME="${{ steps.get_version.outputs.TAG_NAME }}"

          delete_source_asset_if_present() {
            local asset="$1"
            if gh release view "$TAG_NAME" --json assets \
              -q ".assets[] | select(.name == \"$asset\") | .name" \
              | grep -Fxq "$asset"; then
              echo "删除现有 source asset: $asset"
              gh release delete-asset "$TAG_NAME" "$asset" -y
            else
              echo "source asset 不存在，跳过: $asset"
            fi
          }

          # 只清理当前版本的 source archives，保留 updater assets 与其他 Release 文件。
          delete_source_asset_if_present "Sakura-AI-v${VERSION}.tar.gz"
          delete_source_asset_if_present "Sakura-AI-v${VERSION}.zip"

          echo "should_upload=true" >> "$GITHUB_OUTPUT"
          echo "将上传新的 source archives"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建发布资源包
        if: steps.check_assets.outputs.should_upload == 'true'
        run: |
          set -e  # 任何必需文件复制失败立即显式报错

          VERSION="${{ steps.get_version.outputs.VERSION }}"
          TAG_NAME="${{ steps.get_version.outputs.TAG_NAME }}"
          RELEASE_NAME="${TAG_NAME}"
          RELEASE_DIR="Sakura-AI-${RELEASE_NAME}"

          mkdir -p "$RELEASE_DIR"

          echo "📦 正在打包 Sakura-AI 发布资源..."

          echo "📋 打包配置:" > packaging_manifest.txt
          echo "- 版本: ${VERSION}" >> packaging_manifest.txt
          echo "- Tag: ${TAG_NAME}" >> packaging_manifest.txt
          echo "" >> packaging_manifest.txt
          echo "📦 包含文件:" >> packaging_manifest.txt

          # === 必需文件（失败即退出） ===
          # 后端核心代码（剔除 __pycache__ / tests / *.pyc）
          cp -r backend "$RELEASE_DIR/"
          find "$RELEASE_DIR/backend" -type d -name '__pycache__' -exec rm -rf {} +
          find "$RELEASE_DIR/backend" -type d -name 'tests' -exec rm -rf {} +
          find "$RELEASE_DIR/backend" -type f -name '*.pyc' -delete
          echo "- backend/ (核心应用代码)" >> packaging_manifest.txt

          # config 整目录（含 strategies.yaml + labels.yaml，运行时必需）
          cp -r config "$RELEASE_DIR/"
          echo "- config/ (strategies.yaml + labels.yaml)" >> packaging_manifest.txt

          # docker 整目录（Dockerfile / docker-compose.yml / mysql-init / .dockerignore）
          cp -r docker "$RELEASE_DIR/"
          echo "- docker/ (Dockerfile + docker-compose.yml + mysql-init)" >> packaging_manifest.txt

          # 依赖与主 README
          cp requirements.txt "$RELEASE_DIR/"
          echo "- requirements.txt" >> packaging_manifest.txt
          cp README.md "$RELEASE_DIR/"
          echo "- README.md" >> packaging_manifest.txt

          # 启动脚本
          cp start.sh "$RELEASE_DIR/"
          chmod +x "$RELEASE_DIR/start.sh" 2>/dev/null || true
          echo "- start.sh (可执行)" >> packaging_manifest.txt

          # === 可选文件（缺失跳过，不视为错误） ===
          [ -f "README_EN.md" ] && cp README_EN.md "$RELEASE_DIR/" && echo "- README_EN.md" >> packaging_manifest.txt || true
          [ -d "scripts" ] && cp -r scripts "$RELEASE_DIR/" && echo "- scripts/" >> packaging_manifest.txt || true
          [ -d "res" ] && cp -r res "$RELEASE_DIR/" && echo "- res/ (README 截图)" >> packaging_manifest.txt || true
          [ -f "AGENTS.md" ] && cp AGENTS.md "$RELEASE_DIR/" && echo "- AGENTS.md" >> packaging_manifest.txt || true
          [ -f "LICENSE" ] && cp LICENSE "$RELEASE_DIR/" && echo "- LICENSE" >> packaging_manifest.txt || true
          [ -f ".gitignore" ] && cp .gitignore "$RELEASE_DIR/" && echo "- .gitignore" >> packaging_manifest.txt || true
          [ -d "docs" ] && cp -r docs "$RELEASE_DIR/" && echo "- docs/" >> packaging_manifest.txt || true

          # === 运行时空目录 ===
          mkdir -p "$RELEASE_DIR/logs"
          mkdir -p "$RELEASE_DIR/data"

          # === 版本信息文件 ===
          echo "Sakura AI" > "$RELEASE_DIR/VERSION"
          echo "Version: ${VERSION}" >> "$RELEASE_DIR/VERSION"
          echo "Release Date: $(date +'%Y-%m-%d')" >> "$RELEASE_DIR/VERSION"
          echo "GitHub: https://github.com/${{ github.repository }}" >> "$RELEASE_DIR/VERSION"
          echo "- VERSION (版本信息)" >> packaging_manifest.txt

          # === 创建压缩包 ===
          echo "" >> packaging_manifest.txt
          echo "🗜️ 正在创建压缩包..." >> packaging_manifest.txt
          tar -czf "${RELEASE_DIR}.tar.gz" "$RELEASE_DIR/"
          zip -q -r "${RELEASE_DIR}.zip" "$RELEASE_DIR/"

          # 计算文件大小
          TAR_SIZE=$(du -h "${RELEASE_DIR}.tar.gz" | cut -f1)
          ZIP_SIZE=$(du -h "${RELEASE_DIR}.zip" | cut -f1)

          echo "✅ 资源包创建完成" >> packaging_manifest.txt
          echo "- ${RELEASE_DIR}.tar.gz: ${TAR_SIZE}" >> packaging_manifest.txt
          echo "- ${RELEASE_DIR}.zip: ${ZIP_SIZE}" >> packaging_manifest.txt

          echo "✅ Sakura-AI 资源包创建完成"
          cat packaging_manifest.txt

      - name: 上传发布资源
        if: steps.check_assets.outputs.should_upload == 'true'
        run: |
          TAG_NAME="${{ steps.get_version.outputs.TAG_NAME }}"
          ASSET_NAME="Sakura-AI-${TAG_NAME}"

          echo "正在上传资源到 Release ${TAG_NAME}..."

          gh release upload "$TAG_NAME" "${ASSET_NAME}.tar.gz" "${ASSET_NAME}.zip" --clobber

          echo "✅ 资源上传完成"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成发布摘要
        if: steps.check_assets.outputs.should_upload == 'true'
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          TAG_NAME="${{ steps.get_version.outputs.TAG_NAME }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"

          {
            echo "# Release ${TAG_NAME} 发布完成"
            echo ""
            echo "- 版本: **v${VERSION}**"
            echo "- 附件: .tar.gz + .zip（已覆盖上传）"
            echo "- 发布页面: [${RELEASE_URL}](${RELEASE_URL})"
            echo ""
            echo "Release 说明与附件均已更新。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 清理临时文件
        if: always()
        run: |
          rm -f packaging_manifest.txt
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          rm -rf "Sakura-AI-v${VERSION}"
          rm -f "Sakura-AI-v${VERSION}.tar.gz"
          rm -f "Sakura-AI-v${VERSION}.zip"
          echo "✅ 临时文件已清理"

  publish-updater-assets:
    name: 构建并上传 Host Updater
    needs:
      - generate-release
      - build-and-upload-assets
    if: >-
      needs.generate-release.result == 'success' &&
      needs.build-and-upload-assets.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/updater-build.yml
    with:
      version: ${{ needs.generate-release.outputs.version }}
      source_ref: refs/tags/v${{ needs.generate-release.outputs.version }}
    secrets: inherit

  publish-stable-image:
    name: 发布稳定镜像
    needs: generate-release
    if: needs.generate-release.result == 'success'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      source_ref: refs/tags/v${{ needs.generate-release.outputs.version }}
      channel: stable
      version: ${{ needs.generate-release.outputs.version }}
      sync_dockerhub: true
    secrets: inherit

  publish-update-manifest:
    name: 发布更新清单
    needs:
      - generate-release
      - publish-updater-assets
      - publish-stable-image
    if: >-
      always() &&
      needs.generate-release.result == 'success' &&
      needs.publish-updater-assets.result == 'success' &&
      needs.publish-stable-image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出不可变发布 Tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.generate-release.outputs.version }}

      - name: 生成并上传 update-manifest.json
        env:
          VERSION: ${{ needs.generate-release.outputs.version }}
          RELEASE_ACTION: ${{ needs.generate-release.outputs.release_action }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Release workflow versions are generated from backend/__init__.py.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "invalid version: $VERSION" >&2
            exit 1
          }

          actual=$(sed -nE 's/^__version__[^=]*=[^"]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' backend/__init__.py | head -n1)
          [[ "$actual" == "$VERSION" ]] || {
            echo "version mismatch: workflow=$VERSION backend=$actual" >&2
            exit 1
          }

          proto=$(sed -nE 's/^PROTOCOL_VERSION[^=]*=[^0-9]*([0-9]+).*/\1/p' updater/src/sakura_ai_updater/__init__.py | head -n1)
          [[ "$proto" == "1" ]] || {
            echo "unsupported or missing PROTOCOL_VERSION: ${proto:-<empty>}" >&2
            exit 1
          }

          # Created and refresh releases both require the concrete stable image
          # tag to exist before the manifest can become authoritative.
          image="ghcr.io/sakura520222/sakura-ai:v${VERSION}"
          docker manifest inspect "$image" >/dev/null || {
            echo "stable image not found: $image (release_action=$RELEASE_ACTION)" >&2
            exit 1
          }

          cat > update-manifest.json <<JSON
          {"schema_version":1,"version":"${VERSION}","channel":"stable","min_upgrade_from":"0.0.0","image":"${image}","updater":{"protocol_version":${proto},"asset_linux_amd64":"sakura-ai-updater-linux-amd64","asset_linux_arm64":"sakura-ai-updater-linux-arm64"}}
          JSON

          jq -e '
            .schema_version == 1
            and (.version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
            and .channel == "stable"
            and .min_upgrade_from == "0.0.0"
            and (.image | test("^ghcr\\.io/sakura520222/sakura-ai:v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
            and (.updater | type == "object")
            and (.updater.protocol_version | type == "number")
            and .updater.asset_linux_amd64 == "sakura-ai-updater-linux-amd64"
            and .updater.asset_linux_arm64 == "sakura-ai-updater-linux-arm64"
          ' update-manifest.json >/dev/null

          TAG_NAME="v${VERSION}"
          gh release view "$TAG_NAME" >/dev/null
          gh release upload "$TAG_NAME" update-manifest.json --clobber
