name: Docker 镜像发布（可复用）

on:
  workflow_call:
    inputs:
      source_ref:          # 不可变构建来源：commit SHA 或 refs/tags/vX.Y.Z
        required: true
        type: string
      channel:             # development / stable
        required: true
        type: string
      version:             # 稳定版版本号（edge 可不传）
        required: false
        type: string
      revision:            # 构建 commit 的 40 位小写 SHA（稳定版也可显式传入）
        required: false
        type: string
      created:             # 被构建 commit 的 RFC3339 UTC committer timestamp
        required: false
        type: string
      sync_dockerhub:      # 是否同步 Docker Hub（非阻塞）
        required: false
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sakura520222/sakura-ai   # Docker 仓库名必须小写，不能直接用 ${{ github.repository }}

jobs:
  build-and-publish:
    name: 构建并推送 ${{ inputs.channel }}
    runs-on: ubuntu-latest
    outputs:
      # 稳定版本标签已存在时，materialize 会复用其不可变 digest；
      # Docker Hub 必须同步最终发布 digest，而不是本次临时构建 digest。
      digest: ${{ steps.materialize.outputs.digest }}
      immutable_tag: ${{ steps.tags.outputs.immutable_tag }}
    steps:
      - name: 检出代码（固定到 source_ref）
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: 设置 QEMU（模拟编译多架构）
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 crane
        uses: imjasonh/setup-crane@v0.4

      # 计算标签和可信构建身份。所有 channel/输入均 fail closed；开发构建
      # 同一 digest 同时写 edge 与可追溯 immutable tag，不能重复构建。
      - name: 计算镜像标签
        id: tags
        run: |
          set -euo pipefail
          CHANNEL="${{ inputs.channel }}"
          VERSION="${{ inputs.version }}"
          REVISION="${{ inputs.revision }}"
          CREATED="${{ inputs.created }}"
          case "$CHANNEL" in
            stable|development) ;;
            *) echo "unsupported channel: $CHANNEL" >&2; exit 1 ;;
          esac
          ACTUAL_REVISION=$(git rev-parse HEAD)
          [[ "$ACTUAL_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid checked out revision" >&2; exit 1; }
          if [ -n "$REVISION" ] && [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be a 40-character lowercase SHA" >&2
            exit 1
          fi
          if [ -n "$REVISION" ] && [ "$REVISION" != "$ACTUAL_REVISION" ]; then
            echo "revision does not match checked-out commit" >&2
            exit 1
          fi
          REVISION="$ACTUAL_REVISION"
          if [ -z "$VERSION" ]; then
            VERSION=$(sed -nE 's/^__version__[^=]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' backend/__init__.py | head -n1)
          fi
          COMMIT_CREATED=$(git show -s --format=%cI "$ACTUAL_REVISION")
          [[ "$COMMIT_CREATED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([+-][0-9]{2}:[0-9]{2}|Z)$ ]] || {
            echo "commit timestamp is not RFC3339: $COMMIT_CREATED" >&2; exit 1;
          }
          if [ -n "$CREATED" ]; then
            COMMIT_EPOCH=$(date -u -d "$COMMIT_CREATED" +%s 2>/dev/null || true)
            INPUT_EPOCH=$(date -u -d "$CREATED" +%s 2>/dev/null || true)
            if [ -z "$COMMIT_EPOCH" ] || [ -z "$INPUT_EPOCH" ] || [ "$COMMIT_EPOCH" != "$INPUT_EPOCH" ]; then
              echo "created does not match checked-out commit timestamp" >&2
              exit 1
            fi
          fi
          CREATED="$COMMIT_CREATED"
          [[ "$CREATED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([+-][0-9]{2}:[0-9]{2}|Z)$ ]] || {
            echo "created must be RFC3339: $CREATED" >&2; exit 1;
          }
          if [ "$CHANNEL" = "stable" ]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "stable channel requires strict version" >&2; exit 1; }
            IMMUTABLE_TAG="v${VERSION}"
          else
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "development channel requires version" >&2; exit 1; }
            # The committer timestamp is normalized to UTC and made sortable.
            UTC_CREATED=$(date -u -d "$CREATED" +%Y%m%d%H%M%S 2>/dev/null || true)
            [[ "$UTC_CREATED" =~ ^[0-9]{14}$ ]] || { echo "cannot normalize created timestamp" >&2; exit 1; }
            DEV_TAG="dev-${UTC_CREATED}-v${VERSION}-${REVISION}"
            IMMUTABLE_TAG="$DEV_TAG"
          fi
          # The build is pushed without a tag and addressed only by digest.
          # Moving aliases and the immutable channel tag are materialized
          # after the digest is known, so reruns cannot overwrite an existing
          # immutable tag or leave internal staging tags in the public catalog.
          echo "immutable_tag=$IMMUTABLE_TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 构建并推送 GHCR（amd64 + arm64）
        uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SAKURA_BUILD_CHANNEL=${{ inputs.channel }}
            SAKURA_BUILD_VERSION=${{ steps.tags.outputs.version }}
            SAKURA_BUILD_REVISION=${{ steps.tags.outputs.revision }}
            SAKURA_BUILD_CREATED=${{ steps.tags.outputs.created }}
          provenance: false
          cache-from: type=gha,scope=sakura-ai-${{ inputs.channel }}
          cache-to: type=gha,mode=max,scope=sakura-ai-${{ inputs.channel }}

      - name: 按 digest 安全物化 channel 标签
        id: materialize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "invalid build digest; refusing publication" >&2
            exit 1
          }
          SOURCE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          IMMUTABLE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.immutable_tag }}"
          PUBLISHED_DIGEST="$DIGEST"
          existing_error=$(mktemp)
          if existing=$(crane digest "$IMMUTABLE" 2>"$existing_error"); then
            [[ "$existing" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "existing immutable tag returned an invalid digest; refusing publication" >&2
              rm -f "$existing_error"
              exit 1
            }
            if [ "$existing" != "$DIGEST" ]; then
              if [ "${{ inputs.channel }}" = "stable" ]; then
                # A released SemVer tag is authoritative and immutable.  Main
                # pushes still perform the requested build, but a repeated
                # version must keep using the digest published previously.
                echo "stable immutable tag already exists; reusing digest $existing"
                PUBLISHED_DIGEST="$existing"
              else
                echo "development immutable tag already points to a different digest; refusing overwrite" >&2
                rm -f "$existing_error"
                exit 1
              fi
            fi
          else
            # Only an explicit missing-manifest response permits first
            # materialization.  Authentication, rate-limit, and registry
            # failures must not be mistaken for an absent immutable tag.
            if ! grep -Eiq "manifest unknown|manifest_unknown" "$existing_error"; then
              cat "$existing_error" >&2
              rm -f "$existing_error"
              echo "unable to verify immutable tag; refusing publication" >&2
              exit 1
            fi
            crane copy "$SOURCE" "$IMMUTABLE"
            if [ "$(crane digest "$IMMUTABLE")" != "$DIGEST" ]; then
              rm -f "$existing_error"
              echo "immutable tag digest changed during materialization; failing closed" >&2
              exit 1
            fi
          fi
          rm -f "$existing_error"
          if [ "${{ inputs.channel }}" = "development" ]; then
            # Only the current develop head may advance edge.  A rerun of an
            # older commit can reproduce its immutable digest, but must never
            # roll the moving channel alias backward.
            REMOTE_DEVELOP_REVISION=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
            [[ "$REMOTE_DEVELOP_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
              echo "unable to resolve the current develop head; refusing edge update" >&2
              exit 1
            }
            if [ "$REMOTE_DEVELOP_REVISION" != "${{ steps.tags.outputs.revision }}" ]; then
              echo "development source is not the current develop head; refusing edge rollback" >&2
              exit 1
            fi
            crane tag "$IMMUTABLE" edge
          elif [ "${{ inputs.channel }}" = "stable" ]; then
            # Likewise, only the current latest stable Release may advance
            # latest.  Serialization prevents concurrent writers, while this
            # identity gate prevents an older serialized rerun from winning.
            LATEST_RELEASE_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
            if [ "$LATEST_RELEASE_TAG" != "v${{ steps.tags.outputs.version }}" ]; then
              echo "stable source is not the current latest Release; refusing latest rollback" >&2
              exit 1
            fi
            crane tag "$IMMUTABLE" latest
          else
            echo "unsupported channel; refusing alias materialization" >&2
            exit 1
          fi
          echo "digest=$PUBLISHED_DIGEST" >> "$GITHUB_OUTPUT"

  sync-dockerhub:
    name: 同步 Docker Hub（非阻塞）
    if: inputs.sync_dockerhub
    needs: build-and-publish
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: 检查 Docker Hub 凭据
        id: credentials
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub 凭据已配置，将同步"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub 凭据未配置，跳过同步（不影响 GHCR 主链路）"
          fi

      - name: 安装 crane
        if: steps.credentials.outputs.available == 'true'
        uses: imjasonh/setup-crane@v0.4

      - name: 登录 Docker Hub
        if: steps.credentials.outputs.available == 'true'
        run: |
          echo "$DOCKERHUB_TOKEN" | crane auth login -u "$DOCKERHUB_USERNAME" --password-stdin docker.io

      # 必须按 GHCR digest 同步：edge 为可变 tag，若构建 A 后构建 B 覆盖 edge，
      # 构建 A 再按 :edge 复制会拿到构建 B 的镜像。crane copy 按 digest 引用可保证一致性。
      - name: 按 GHCR digest 复制到 Docker Hub
        if: steps.credentials.outputs.available == 'true'
        run: |
          SOURCE="ghcr.io/${IMAGE_NAME}@${{ needs.build-and-publish.outputs.digest }}"
          if [ "${{ inputs.channel }}" = "stable" ]; then
            crane copy "$SOURCE" "docker.io/${IMAGE_NAME}:v${{ inputs.version }}"
            crane tag "docker.io/${IMAGE_NAME}:v${{ inputs.version }}" latest
          elif [ "${{ inputs.channel }}" = "development" ]; then
            crane copy "$SOURCE" "docker.io/${IMAGE_NAME}:edge"
            crane copy "$SOURCE" "docker.io/${IMAGE_NAME}:${{ needs.build-and-publish.outputs.immutable_tag }}"
          else
            echo "unsupported channel; refusing Docker Hub sync" >&2
            exit 1
          fi
