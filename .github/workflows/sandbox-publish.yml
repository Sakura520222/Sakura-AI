name: Agent sandbox image publish (reusable)

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      channel:
        required: true
        type: string
      version:
        required: false
        type: string
      revision:
        required: false
        type: string
    outputs:
      sandboxd_digest:
        description: Immutable sandboxd manifest digest
        value: ${{ jobs.publish.outputs.sandboxd_digest }}
      runner_digest:
        description: Immutable Agent runner manifest digest
        value: ${{ jobs.publish.outputs.runner_digest }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  SANDBOXD_REPOSITORY: ghcr.io/sakura520222/sakura-ai-sandboxd
  RUNNER_REPOSITORY: ghcr.io/sakura520222/sakura-ai-agent-runner

jobs:
  publish:
    name: Publish sandboxd and runner images
    runs-on: ubuntu-24.04
    outputs:
      sandboxd_digest: ${{ steps.inspect.outputs.sandboxd_digest }}
      runner_digest: ${{ steps.inspect.outputs.runner_digest }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Validate channel and source identity
        id: tags
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          [[ "$actual" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ -n "$REVISION" && "$REVISION" != "$actual" ]]; then
            echo "requested revision does not match checked out source" >&2
            exit 1
          fi
          created=$(git show -s --format=%cI "$actual")
          [[ "$created" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([+-][0-9]{2}:[0-9]{2}|Z)$ ]] || {
            echo "cannot validate commit timestamp" >&2
            exit 1
          }
          case "$CHANNEL" in
            stable)
              [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
              primary="v$VERSION"
              ;;
            development)
              # Keep the sandbox tag byte-for-byte aligned with the Web
              # development image.  The updater resolves the pair from the
              # full catalog target (timestamp, version and revision), then
              # verifies the revision-only alias below before pinning a digest.
              if [[ -z "$VERSION" ]]; then
                VERSION=$(sed -nE 's/^__version__[^=]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' backend/__init__.py | head -n1)
              fi
              [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                echo "development channel requires version" >&2
                exit 1
              }
              utc_created=$(date -u -d "$created" +%Y%m%d%H%M%S 2>/dev/null || true)
              [[ "$utc_created" =~ ^[0-9]{14}$ ]] || {
                echo "cannot normalize commit timestamp" >&2
                exit 1
              }
              primary="dev-${utc_created}-v${VERSION}-${actual}"
              ;;
            *)
              echo "unsupported sandbox channel: $CHANNEL" >&2
              exit 1
              ;;
          esac
          immutable="sha-${actual:0:40}"
          {
            echo "primary=$primary"
            echo "immutable=$immutable"
            echo "revision=$actual"
            echo "version=$VERSION"
            echo "created=$created"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish sandboxd
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.sandboxd
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SAKURA_BUILD_CHANNEL=${{ inputs.channel }}
            SAKURA_BUILD_VERSION=${{ steps.tags.outputs.version }}
            SAKURA_BUILD_REVISION=${{ steps.tags.outputs.revision }}
            SAKURA_BUILD_CREATED=${{ steps.tags.outputs.created }}
          tags: |
            ${{ env.SANDBOXD_REPOSITORY }}:${{ steps.tags.outputs.primary }}
            ${{ env.SANDBOXD_REPOSITORY }}:${{ steps.tags.outputs.immutable }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tags.outputs.revision }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            com.sakura-ai.build.channel=${{ inputs.channel }}
            com.sakura-ai.component=sandboxd

      - name: Build and publish runner
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.agent-sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SAKURA_BUILD_CHANNEL=${{ inputs.channel }}
            SAKURA_BUILD_VERSION=${{ steps.tags.outputs.version }}
            SAKURA_BUILD_REVISION=${{ steps.tags.outputs.revision }}
            SAKURA_BUILD_CREATED=${{ steps.tags.outputs.created }}
          tags: |
            ${{ env.RUNNER_REPOSITORY }}:${{ steps.tags.outputs.primary }}
            ${{ env.RUNNER_REPOSITORY }}:${{ steps.tags.outputs.immutable }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tags.outputs.revision }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            com.sakura-ai.build.channel=${{ inputs.channel }}
            com.sakura-ai.component=agent-runner

      - name: Inspect immutable manifest digests
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          sandboxd_digest=$(docker buildx imagetools inspect \
            "${SANDBOXD_REPOSITORY}:${{ steps.tags.outputs.immutable }}" \
            --format '{{.Manifest.Digest}}')
          runner_digest=$(docker buildx imagetools inspect \
            "${RUNNER_REPOSITORY}:${{ steps.tags.outputs.immutable }}" \
            --format '{{.Manifest.Digest}}')
          [[ "$sandboxd_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "sandboxd manifest inspection did not return a valid digest" >&2
            exit 1
          }
          [[ "$runner_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "runner manifest inspection did not return a valid digest" >&2
            exit 1
          }
          echo "sandboxd_digest=$sandboxd_digest" >> "$GITHUB_OUTPUT"
          echo "runner_digest=$runner_digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Agent sandbox immutable images"
            echo "- sandboxd: ${SANDBOXD_REPOSITORY}@${sandboxd_digest}"
            echo "- runner: ${RUNNER_REPOSITORY}@${runner_digest}"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "sandboxd=${SANDBOXD_REPOSITORY}@${sandboxd_digest}"
            echo "runner=${RUNNER_REPOSITORY}@${runner_digest}"
          } > agent-sandbox-digests.txt

      - name: Upload immutable sandbox digest record
        uses: actions/upload-artifact@v7
        with:
          name: agent-sandbox-digests-${{ github.run_id }}
          path: agent-sandbox-digests.txt
          if-no-files-found: error
          retention-days: 7
