name: Gitflow 自动同步

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_branch:
        description: 要同步的源分支
        required: false
        default: main
      target_branch:
        description: 要同步的目标分支
        required: false
        default: develop

concurrency:
  group: gitflow-sync-main-to-develop
  cancel-in-progress: false

jobs:
  sync-main-to-develop:
    name: 将 main 回合到 develop
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      revision: ${{ steps.sync.outputs.revision }}
      target: ${{ steps.branches.outputs.target }}
      using_pat: ${{ steps.push-token.outputs.using_pat }}
    # push 到 main 或手动触发时运行；on 已限定事件来源，此处无需额外过滤
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: 计算同步分支
        id: branches
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "source=${{ inputs.source_branch }}" >> "$GITHUB_OUTPUT"
            echo "target=${{ inputs.target_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "source=main" >> "$GITHUB_OUTPUT"
            echo "target=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: 检查推送令牌类型
        id: push-token
        env:
          RELEASE_PAT: ${{ secrets.MY_RELEASE_PAT }}
        run: |
          if [ -n "$RELEASE_PAT" ]; then
            echo "using_pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "using_pat=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检出目标分支
        uses: actions/checkout@v7
        with:
          # PAT push 会继续触发 develop CI/开发镜像；仅回退 GITHUB_TOKEN 时，
          # GitHub 的防递归规则会抑制该 push 产生的后续 workflow runs。
          token: ${{ secrets.MY_RELEASE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ steps.branches.outputs.target }}

      - name: 配置 Git 用户
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 同步源分支到目标分支
        id: sync
        env:
          SOURCE_BRANCH: ${{ steps.branches.outputs.source }}
          TARGET_BRANCH: ${{ steps.branches.outputs.target }}
        run: |
          set -e
          git fetch origin "$SOURCE_BRANCH" "$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"

          if git merge --no-ff --no-edit "origin/$SOURCE_BRANCH"; then
            if git diff --quiet HEAD "origin/$TARGET_BRANCH"; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "✅ ${TARGET_BRANCH} 已包含 ${SOURCE_BRANCH}，无需推送"
            else
              git push origin "HEAD:$TARGET_BRANCH"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "✅ 已将 ${SOURCE_BRANCH} 同步到 ${TARGET_BRANCH}"
            fi
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git merge --abort || true
            exit 1
          fi
          REVISION=$(git rev-parse HEAD)
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || {
            echo "无法解析同步后的 develop revision" >&2
            exit 1
          }
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: 同步失败时创建 Issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const source = '${{ steps.branches.outputs.source }}';
            const target = '${{ steps.branches.outputs.target }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Gitflow sync conflict: ${source} -> ${target}`,
              body: [
                `自动同步 ${source} 到 ${target} 失败，可能存在合并冲突。`,
                '',
                `请维护者手动执行同步并解决冲突。`,
                '',
                `Workflow run: ${runUrl}`,
              ].join('\n'),
              labels: ['gitflow', 'maintenance'],
            });

  # A push made with GITHUB_TOKEN intentionally does not trigger another
  # workflow run.  Publish the synchronized develop revision explicitly in
  # that fallback mode; when a PAT is available, docker-edge.yml is triggered
  # by the push and this job stays skipped to avoid duplicate builds.
  publish-synchronized-development:
    name: 发布同步后的 development 镜像
    needs: sync-main-to-develop
    if: >-
      needs.sync-main-to-develop.outputs.changed == 'true' &&
      needs.sync-main-to-develop.outputs.target == 'develop' &&
      needs.sync-main-to-develop.outputs.using_pat != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      source_ref: ${{ needs.sync-main-to-develop.outputs.revision }}
      channel: development
      sync_dockerhub: true
    secrets: inherit
