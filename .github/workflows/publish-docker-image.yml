name: 发布 Docker 镜像

on:
  workflow_call:
    inputs:
      ref:
        description: 要构建的 Git ref（分支、Tag 或 SHA）
        required: false
        default: main
        type: string
      version:
        description: 镜像版本（留空时读取 backend/__init__.py）
        required: false
        default: ''
        type: string
      update_latest:
        description: 同时更新 latest 标签
        required: false
        default: false
        type: boolean

concurrency:
  group: docker-publish-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 构建并推送多架构镜像
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: 生成镜像名称和标签
        id: image
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="$INPUT_VERSION"
          COMMIT_SHA=$(git rev-parse HEAD)

          if [ -z "$VERSION" ]; then
            VERSION=$(sed -n 's/^__version__[[:space:]]*=[[:space:]]*"\([0-9A-Za-z.+-]*\)".*/\1/p' backend/__init__.py | head -n 1)
          fi
          VERSION="${VERSION#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "无法获得有效的语义化版本号: ${VERSION:-<空>}" >&2
            exit 1
          fi
          TAG_VERSION="${VERSION//+/-}"

          TAGS=(
            "${IMAGE}:${TAG_VERSION}"
            "${IMAGE}:v${TAG_VERSION}"
            "${IMAGE}:sha-${COMMIT_SHA::12}"
          )

          # 预发布版本不移动 major/minor 标签，避免覆盖稳定版本入口。
          if [[ "$VERSION" != *-* && "$VERSION" != *+* ]]; then
            MAJOR="${VERSION%%.*}"
            REMAINDER="${VERSION#*.}"
            MINOR="${REMAINDER%%.*}"
            TAGS+=("${IMAGE}:${MAJOR}.${MINOR}" "${IMAGE}:${MAJOR}")
          fi

          if [ "$UPDATE_LATEST" = "true" ]; then
            TAGS+=("${IMAGE}:latest")
          fi

          {
            echo "name=$IMAGE"
            echo "version=$VERSION"
            echo 'tags<<EOF'
            printf '%s\n' "${TAGS[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 提取镜像元数据
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.title=Sakura AI Reviewer
            org.opencontainers.image.description=AI-powered GitHub pull request reviewer and issue analyzer
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: 生成发布摘要
        shell: bash
        run: |
          {
            echo '# Docker 镜像发布完成'
            echo
            echo "- 镜像：\`${{ steps.image.outputs.name }}\`"
            echo "- 版本：\`${{ steps.image.outputs.version }}\`"
            echo '- 架构：`linux/amd64`、`linux/arm64`'
            echo
            echo '发布的标签：'
            echo '```text'
            echo '${{ steps.image.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
