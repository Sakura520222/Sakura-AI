# PR审查策略配置

strategies:
  # 小改动策略
  quick:
    name: "⚡️ 快速审查"
    conditions:
      max_files: 5
      max_lines: 2000
    prompt: |
      Focus on syntax errors, obvious functional bugs, confirmed security issues,
      and regressions in the changed behavior. Keep the review concise and evidence-based.

  # 标准审查策略
  standard:
    name: "🔍 标准审查"
    conditions:
      max_files: 20
      max_lines: 5000
    prompt: |
      Review correctness, security, error handling, compatibility, performance,
      and maintainability. Prioritize concrete defects over stylistic preferences.

  # 深度审查策略
  deep:
    name: "🔬 深度审查"
    conditions:
      max_files: 100
      max_lines: 20000
    prompt: |
      Perform a deep architectural and behavioral review. Trace cross-file effects,
      concurrency and data-flow risks, security boundaries, failure handling, and regressions.

  # 超大PR策略
  large:
    name: "📋 汇总报告"
    conditions:
      max_files: 999999
      max_lines: 99999999
    prompt: |
      Review this large PR by first mapping the changed modules and highest-risk areas.
      Inspect representative and critical files, report confirmed defects, and note material
      coverage limitations in the summary without inventing findings.

# 文件过滤规则
file_filters:
  # 跳过的文件类型
  skip_extensions:
    - .lock
    - .gitignore
    - .dockerignore
    - LICENSE
  
  # 跳过的文件路径
  skip_paths:
    - node_modules/
    - vendor/
    - .git/
    - dist/
    - build/
    - __pycache__/
    - .venv/
    - venv/
  
  # 代码文件扩展名
  code_extensions:
    - .py
    - .js
    - .ts
    - .tsx
    - .jsx
    - .go
    - .java
    - .cpp
    - .c
    - .h
    - .cs
    - .php
    - .rb
    - .rs
    - .swift
    - .kt
    - .scala
    - .sh
    - .sql
    - .css
    - .scss
    - .html
    - .vue
    - .svelte

# 上下文增强配置
context_enhancement:
  # 是否启用项目结构展示
  enable_project_structure: true
  
  # 项目结构最大文件数
  max_structure_files: 1000
  
  # 是否启用AI函数工具（让AI自主查看文件）
  enable_ai_tools: true
  
  # AI工具的最大调用次数（防止无限循环）
  max_tool_iterations: 200
  
  # 单个文件最大读取大小（字节）
  max_file_size: 500000  # 500KB

  # deep 策略下包含的最大文件数（按变更量排序取前 N 个）
  max_files_for_deep_strategy: 20

  # 单文件最大读取行数（超过则截断并提示AI使用行范围读取）
  max_file_lines: 1000

  # 搜索匹配时的默认上下文行数（匹配行前后各显示多少行）
  default_context_lines: 20

  # 搜索匹配时的最大上下文行数
  max_context_lines: 500

  # 跨文件搜索工具配置
  search_in_files:
    use_search_api: true           # 优先使用 GitHub Search API
    default_context_lines: 50       # 默认上下文行数
    default_max_results: 20        # 默认最大结果数
    skip_binary: true              # 是否跳过二进制文件
    max_files_to_search: 100       # 回退模式下最大扫描文件数

  # Git 工具配置
  git_tools:
    default_branch_count: 20    # 默认返回分支数量
    default_commit_count: 10    # 默认返回提交数量

  # 外部 CI 失败注入配置 / External CI failure injection config
  # 由 check_run.completed / workflow_job.completed webhook 采集，审查时注入上下文
  ci_failure_injection:
    # 是否启用 / Enable
    enabled: true
    # 失败记录保留天数（TTL）/ Retention days
    retention_days: 7
    # 单次审查最多注入的失败记录数 / Max failure records per review
    max_records: 10
    # 单条失败最多展示的 annotations 数（超出部分计数提示，不截断文本）/ Max annotations per failure
    max_annotations_per_record: 8

  # .sakura/ 记忆系统配置 / .sakura/ memory system config
  sakura_memory:
    # 是否启用记忆系统 / Enable memory system
    enabled: true

    # 反思配置 / Reflection config
    reflection:
      # 是否启用审查后反思 / Enable post-review reflection
      enabled: true
      # 反思使用的模型（null=使用与审查相同的模型）/ Model for reflection (null=same as review model)
      model: null
      # 反思 Prompt 模板路径（可选覆盖）/ Reflection prompt template path (optional override)
      prompt_template: null
      # 反思 prompt 中包含的最大评论条数 / Max comments included in reflection prompt
      max_comments: 30
      # 反思 prompt 中包含的最大变更文件条数 / Max changed files in reflection prompt
      max_changed_files: 30
      # 反思 prompt 中包含的最大新增提交条数 / Max new commits in reflection prompt
      max_new_commits: 20

    # Issue 反思配置 / Issue reflection config
    issue_reflection:
      # 是否启用 Issue 分析后反思 / Enable post-issue-analysis reflection
      enabled: true
      # Issue 反思使用的模型（null=使用与审查相同的模型）/ Model for issue reflection (null=same as review model)
      model: null
      # Issue 反思 Prompt 模板路径（可选覆盖）/ Issue reflection prompt template path (optional override)
      prompt_template: null

    # 合并配置 / Consolidation config
    consolidation:
      # 触发合并的反思轮数 / Reflections before consolidation
      interval: 5
      # 合并使用的模型 / Model for consolidation
      model: null
      # memory.md 最大字符数 / Max chars for memory.md
      max_memory_chars: 2000
      # SAKURA.md 最大字符数 / Max chars for SAKURA.md
      max_sakura_chars: 3000
      # 合并后是否清理旧的反思文件 / Clean old reflections after consolidation
      cleanup_old_reflections: false
      # 一个文件失败时是否仍提交另一个 / Commit partial results on failure
      partial_commit: true
      # 每个文件合并时工具调用最大轮数 / Max tool-call iterations per file consolidation
      max_iterations: 50

    # 知识提取配置 / Knowledge extraction config
    knowledge_extraction:
      # 是否启用自动知识提取 / Enable auto knowledge extraction
      enabled: true
      # 触发提取的最低反思轮数 / Minimum reflections before extraction
      min_reflections: 15
      # 每个分类提取时工具调用最大轮数 / Max tool-call iterations per category
      max_iterations: 100

    # 初始化配置 / Initialization config
    initialization:
      # 是否自动初始化 / Auto-init .sakura/ for new repos
      auto_init: true
      # 自动初始化的提交信息 / Commit message for auto-init
      init_commit_message: "chore: initialize .sakura/ directory for Sakura AI"

    # 目录结构约定 / Directory structure convention
    directory_convention:
      enabled: true
      # 初始化时自动创建子目录 / Auto-create subdirectories during init
      auto_create_subdirs: true
      categories:
        memory:
          description: "审查反思文件 / Reflection files (auto-generated)"
          priority: 0
          # 反思文件由系统动态生成，不需要占位文件
          skip_placeholder: true
        rules:
          description: "审查规则、编码规范 / Review rules, coding standards"
          priority: 1
          placeholder: "# 审查规则\n\n在此目录下存放项目审查规则和编码规范。\n"
        docs:
          description: "架构文档、设计决策 / Architecture docs, design decisions"
          priority: 2
          placeholder: "# 项目文档\n\n在此目录下存放项目架构文档和设计决策。\n"
        plans:
          description: "开发计划、路线图 / Development plans, roadmaps"
          priority: 3
          placeholder: "# 开发计划\n\n在此目录下存放开发计划和路线图。\n"

# 审查批准策略配置
review_policy:
  # 是否启用自动批准功能（建议先设为false观察效果）
  enabled: true
  
  # 批准阈值：分数 >= 此值才考虑批准
  approve_threshold: 8
  
  # 阻断阈值：分数 < 此值自动请求变更
  block_threshold: 4
  
  # 是否在存在Critical问题时自动请求变更
  block_on_critical: true
  
  # 允许的Major问题数量上限
  max_major_issues: 1
  
  # 忽略的文件模式（这些文件不影响评分决策）
  ignored_patterns:
    - "*.md"
    - "LICENSE"
    - ".gitignore"
    - "*.lock"
    - "*.txt"
    - "CHANGELOG*"
    - "*.yml"
    - "*.yaml"
  
  # 特定仓库的覆盖配置（可选）
  # 示例：为核心项目设置更严格的标准
  repo_overrides: {}
  #  "owner/repo-name":
  #    approve_threshold: 9  # 更严格
  #    block_threshold: 5    # 更宽松
  
  # 幂等性检查：是否检查已有Review避免重复提交
  enable_idempotency_check: true
  
  # Review评论模板（中文，默认）
  review_templates:
    approve: |
      ## 🌸 Sakura AI 审查报告 - {strategy_name}
      
      ### ✅ **审查通过**
      
      {summary}
      
      ## 代码质量评分：{score}/10
      ### AI审查决策：批准合并
      
      {comment_summary}
    
    request_changes: |
      ## 🌸 Sakura AI 审查报告 - {strategy_name}
      
      ### ❌ **请求变更**
      
      {summary}
      
      ## 代码质量评分：{score}/10
      ### AI审查决策：需要修复后重新提交
      
      **阻断原因**：{decision_reason}
      
      {comment_summary}
    
    comment: |
      ## 🌸 Sakura AI 审查报告 - {strategy_name}

      ### 💬 **审查评论**

      {summary}

      ## 代码质量评分：{score}/10
      ### AI审查决策：请人工复审

      {comment_summary}

  # Review评论模板（英文）
  review_templates_en:
    approve: |
      ## 🌸 Sakura AI Review Report - {strategy_name}
      
      ### ✅ **Approved**
      
      {summary}
      
      ## Code Quality Score: {score}/10
      ### AI Decision: Approve merge
      
      {comment_summary}
    
    request_changes: |
      ## 🌸 Sakura AI Review Report - {strategy_name}
      
      ### ❌ **Changes Requested**
      
      {summary}
      
      ## Code Quality Score: {score}/10
      ### AI Decision: Changes required before resubmitting
      
      **Block Reason**: {decision_reason}
      
      {comment_summary}
    
    comment: |
      ## 🌸 Sakura AI Review Report - {strategy_name}

      ### 💬 **Review Comment**

      {summary}

      ## Code Quality Score: {score}/10
      ### AI Decision: Manual review requested

      {comment_summary}

# ========== Issue 分析配置 ==========
issue_analysis:
  # Issue 分类定义
  categories:
    - name: bug
      description: "软件缺陷、功能异常、崩溃"
      keywords: ["bug", "error", "crash", "broken", "fail", "issue", "wrong", "fix"]
    - name: feature
      description: "新功能请求、功能增强"
      keywords: ["feature", "request", "add", "support", "implement", "new"]
    - name: question
      description: "使用问题、疑问"
      keywords: ["question", "how", "help", "why", "what", "?"]
    - name: documentation
      description: "文档改进"
      keywords: ["doc", "readme", "documentation", "guide", "tutorial"]
    - name: enhancement
      description: "功能增强、改进"
      keywords: ["enhancement", "improve", "optimize", "upgrade", "refactor"]
    - name: performance
      description: "性能问题"
      keywords: ["slow", "performance", "speed", "latency", "memory", "leak"]
    - name: security
      description: "安全问题"
      keywords: ["security", "vulnerability", "xss", "injection", "auth", "permission", "cve"]
    - name: refactor
      description: "代码重构、技术债清理"
      keywords: ["refactor", "cleanup", "tech debt", "deprecation", "rewrite"]
    - name: other
      description: "其他无法归类的 Issue"
      keywords: []

  # Issue 优先级判定规则
  priority_rules:
    critical:
      keywords: ["urgent", "critical", "blocker", "production", "down", "data loss", "security"]
    high:
      keywords: ["important", "should", "need", "affect", "impact", "breaking"]
    medium:
      keywords: ["moderate", "should", "affect some"]
    low:
      keywords: ["minor", "nice to have", "low priority", "suggestion", "cosmetic"]

  # PR-Issue 关联关键词
  issue_reference_keywords:
    - "fixes"
    - "fix"
    - "closes"
    - "close"
    - "resolves"
    - "resolve"
    - "addresses"
    - "related to"
    - "refs"
    - "ref"

  # 关联 Issue 数量上限
  max_linked_issues_in_prompt: 5

  # Issue 分析系统提示词（英文 focus，强化型契约由代码注入）
  system_prompt: |
    Analyze the GitHub issue against the repository code base. Establish concrete
    evidence with tools before judging category, priority, and feasibility, then
    recommend labels, assignees, milestone, duplicate detection, and a normalized
    title when the original is unclear.

    ## Analysis focus
    - Classify the issue precisely; prefer the most specific applicable category.
    - Estimate priority from user-reported impact and reproduction evidence, not wording alone.
    - Assess feasibility by inspecting the affected code paths and their complexity.
    - Recommend labels only from the available repository labels, each with a confidence and reason.
    - Recommend assignees only from repository collaborators who plausibly own the affected area.
    - Suggest a duplicate only when you can cite the other issue number with evidence.
    - Suggest a normalized title only when the original title is unclear or malformed.

  # 自动评论模板（中文，默认）
  comment_template: |
    ## 🌸 Sakura AI Issue 分析报告

    ### 📋 分析结果
    - **分类**: {category}
    - **优先级**: {priority}
    - **可行性**: {feasibility}
    {suggested_title_section}

    ### 📝 摘要
    {summary}

    ### 🏷️ 建议标签
    {labels}

    ### 👥 建议指派人
    {assignees}

    {related_info}

    ---
    *此评论由 Sakura AI 自动生成。*

  # 自动评论模板（英文）
  comment_template_en: |
    ## 🌸 Sakura AI Issue Analysis Report

    ### 📋 Analysis Result
    - **Category**: {category}
    - **Priority**: {priority}
    - **Feasibility**: {feasibility}
    {suggested_title_section}

    ### 📝 Summary
    {summary}

    ### 🏷️ Suggested Labels
    {labels}

    ### 👥 Suggested Assignees
    {assignees}

    {related_info}

    ---
    *This comment was generated automatically by Sakura AI.*

# ========== PR 总结配置 ==========
pr_summary:
  system_prompt: |
    你是专业的代码审查助手，擅长总结代码变更。请根据提供的 PR 变更信息，生成简洁清晰的总结。
    要求：
    - 使用中文
    - 结构化输出：变更概览、主要改动列表、影响范围
    - 突出重要变更（新增功能、重构、Bug修复等）
    - 保持简洁，不超过 300 字
  user_template: |
    请总结以下 PR 的变更内容：

    PR 标题: {title}
    变更文件数: {file_count}
    代码变更: +{additions}/-{deletions}

    变更文件列表:
    {file_list}

    Commit 信息:
    {commits}

# ========== PR 依赖图配置 ==========
pr_dependency_graph:
  system_prompt: |
    你是代码依赖分析专家。根据提供的 PR 变更文件及其 import/模块引用信息，生成 Mermaid 语法描述的依赖关系图。

    要求：
    - 使用中文标注节点（文件短名），保持简洁可读
    - 只包含有实际依赖关系的文件，不要孤立节点
    - 使用 graph TD（从上到下）方向
    - PR 变更文件使用实线连接，变更文件对外部模块的依赖使用虚线连接（style ... stroke-dasharray: 5 5）
    - 节点总数不超过 {max_nodes} 个
    - 输出纯 Mermaid 代码块，不要额外解释
  user_template: |
    请根据以下 PR 变更信息生成依赖关系图：

    PR 标题: {title}
    总文件数: {file_count}  代码文件数: {code_file_count}  本轮分析文件数: {analyzed_file_count}

    文件依赖关系:
    {import_context}

    请生成 Mermaid graph TD 语法的依赖图。只展示文件间的直接依赖关系。
    如果变更文件之间没有任何依赖关系，请输出文字说明"该 PR 的变更文件之间没有明显的模块依赖关系"。
