{% extends "base.html" %}

{% block title %}{{ _('log.title') }} - Sakura AI{% endblock %}

{% block content %}
<div class="space-y-4">
    <!-- 页面标题 -->
    <div>
        <h1 class="text-2xl font-bold">{{ _('log.title') }}</h1>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ _('log.title') }}</p>
    </div>

    <!-- 日志列表（通过 HTMX 加载） -->
    <div id="log-list-container" hx-get="/logs/list-fragment" hx-trigger="load" hx-swap="innerHTML">
        <div class="text-center py-8 text-gray-400">
            <svg class="w-8 h-8 mx-auto animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            <p class="mt-2">{{ _('common.loading') }}</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
{{ super() }}
<script>
var loadLogPage = function(n) { loadListPage('log-list-container', '/logs/list-fragment', n); };
initFilterForm('log-filter-form', 'log-list-container', '/logs/list-fragment');

function setLogDetailOpen(reviewId, trigger, open) {
    var detail = document.getElementById('log-detail-' + reviewId);
    if (!detail) return;
    detail.classList.toggle('hidden', !open);

    var icon = trigger ? trigger.querySelector('[data-log-detail-icon]') : null;
    if (icon) {
        icon.classList.toggle('rotate-180', open);
    }
}

window.openLogDetailLoading = function(reviewId, trigger) {
    setLogDetailOpen(reviewId, trigger, true);
};

window.toggleLoadedLogDetail = function(reviewId, trigger) {
    var detail = document.getElementById('log-detail-' + reviewId);
    if (!detail || detail.dataset.loaded !== 'true') {
        return false;
    }

    setLogDetailOpen(reviewId, trigger, detail.classList.contains('hidden'));
    return true;
};

window.markLogDetailLoaded = function(reviewId, trigger, event) {
    var detail = document.getElementById('log-detail-' + reviewId);
    if (!detail) return;

    if (event && event.detail && event.detail.successful === false) {
        setLogDetailOpen(reviewId, trigger, false);
        return;
    }

    detail.dataset.loaded = 'true';
    setLogDetailOpen(reviewId, trigger, true);
};
</script>
{% endblock %}
