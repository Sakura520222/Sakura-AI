<section class="mt-4 space-y-4" x-data="notificationPreferences()" x-init="load()">
  <p class="text-sm text-pink-600" role="status" x-text="feedback"></p>
  <template x-for="endpoint in endpoints" :key="endpoint.id">
    <div class="rounded-lg border p-4 space-y-3">
      <div class="flex flex-wrap gap-2 items-center">
        <input aria-label="{{ _('notification_center.name') }}" x-model="endpoint.name" class="rounded border px-2 py-1 dark:bg-gray-800" maxlength="100">
        <span class="text-sm" x-text="endpoint.provider"></span>
        <span class="text-xs text-gray-500 break-all" x-text="endpoint.address"></span>
        <span class="text-xs" x-text="endpoint.verified ? {{ _('notification_center.verified') | tojson | forceescape }} : {{ _('notification_center.unverified') | tojson | forceescape }}"></span>
      </div>
      <div class="flex flex-wrap gap-3 text-sm">
        <input x-show="endpoint.provider === 'webhook'" x-model="endpoint.newSecret" type="password" autocomplete="new-password" placeholder="{{ _('notification_center.replace_secret') }}" aria-label="{{ _('notification_center.replace_secret') }}" class="rounded border px-2 py-1 dark:bg-gray-800">
        <label><input type="checkbox" x-model="endpoint.enabled"> {{ _('common.enabled') }}</label>
        <button type="button" class="text-pink-600" @click="saveEndpoint(endpoint)">{{ _('common.save') }}</button>
        <button type="button" class="text-pink-600" @click="sendTest(endpoint)" :disabled="!endpoint.verified || !endpoint.enabled">{{ _('notification_center.test') }}</button>
        <button type="button" class="text-pink-600" @click="checkStatus(endpoint)">{{ _('notification_center.delivery_status') }}</button>
        <span class="text-xs text-gray-500" x-text="endpoint.deliveryStatus || ''"></span>
        <button type="button" class="text-pink-600" @click="verify(endpoint)" x-show="!endpoint.verified && endpoint.provider !== 'telegram'">{{ _('notification_center.verify') }}</button>
        <input x-show="!endpoint.verified && endpoint.provider === 'email'" x-model="endpoint.code" placeholder="{{ _('notification_center.verification_code') }}" aria-label="{{ _('notification_center.verification_code') }}" class="border rounded px-2 dark:bg-gray-800">
        <button type="button" class="text-red-600" @click="unbind(endpoint)">{{ _('notification_center.unbind') }}</button>
      </div>
    </div>
  </template>
  <details class="rounded-lg border p-4">
    <summary class="cursor-pointer font-medium">{{ _('notification_center.add_endpoint') }}</summary>
    <form @submit.prevent="addEndpoint()" class="mt-3 flex flex-wrap gap-3">
      <select x-model="newEndpoint.provider" aria-label="{{ _('notification_center.provider') }}" class="rounded border p-2 dark:bg-gray-800">
        <template x-for="provider in providers.filter(item => item.fields?.includes('address') || item.fields?.includes('url'))" :key="provider.channel"><option :value="provider.channel" x-text="provider.channel"></option></template>
      </select>
      <input x-model="newEndpoint.name" required maxlength="100" placeholder="{{ _('notification_center.name') }}" aria-label="{{ _('notification_center.name') }}" class="rounded border p-2 dark:bg-gray-800">
      <input x-model="newEndpoint.address" required maxlength="320" placeholder="{{ _('notification_center.address') }}" aria-label="{{ _('notification_center.address') }}" class="rounded border p-2 dark:bg-gray-800">
      <input x-show="newEndpoint.provider === 'webhook'" x-model="newEndpoint.signing_secret" type="password" autocomplete="new-password" placeholder="{{ _('notification_center.signing_secret') }}" aria-label="{{ _('notification_center.signing_secret') }}" class="rounded border p-2 dark:bg-gray-800">
      <button class="rounded bg-pink-500 px-4 py-2 text-white">{{ _('common.add') }}</button>
    </form>
    <p class="mt-2 text-xs text-gray-500">{{ _('notification_center.verification_help') }}</p>
  </details>
  <div class="rounded-lg border p-4">
    <h4 class="font-medium">{{ _('notification_center.preferences') }}</h4>
    <p class="text-sm text-gray-500 mt-1">{{ _('notification_center.preferences_help') }}</p>
    <form @submit.prevent="addRule()" class="mt-3 grid gap-3 sm:grid-cols-2">
      <select x-model="rule.event_type" aria-label="{{ _('notification_center.event') }}" class="border rounded p-2 dark:bg-gray-800">
        <option value="*">{{ _('notification_center.all_events') }}</option>
        <template x-for="event in eventTypes" :key="event"><option :value="event" x-text="event"></option></template>
      </select>
      <select x-model="rule.endpoint_id" aria-label="{{ _('notification_center.target') }}" class="border rounded p-2 dark:bg-gray-800">
        <option value="">{{ _('notification_center.web_inbox') }}</option>
        <template x-for="endpoint in endpoints" :key="endpoint.id"><option :value="endpoint.id" x-text="endpoint.name + ' (' + endpoint.provider + ')'"></option></template>
      </select>
      <input x-model="rule.repo_name" placeholder="{{ _('notification_center.repo_scope') }}" aria-label="{{ _('notification_center.repo_scope') }}" class="border rounded p-2 dark:bg-gray-800">
      <select x-model="rule.min_severity" aria-label="{{ _('notification_center.severity') }}" class="border rounded p-2 dark:bg-gray-800">
        {% for level in ['info','warning','error','critical'] %}<option value="{{ level }}">{{ _('notification_center.' + level) }}</option>{% endfor %}
      </select>
      <input x-model="rule.resource_type" placeholder="{{ _('notification_center.resource_type') }}" aria-label="{{ _('notification_center.resource_type') }}" class="border rounded p-2 dark:bg-gray-800">
      <input x-model="rule.resource_id" placeholder="{{ _('notification_center.resource_id') }}" aria-label="{{ _('notification_center.resource_id') }}" class="border rounded p-2 dark:bg-gray-800">
      <label><input type="checkbox" x-model="rule.enabled"> {{ _('common.enabled') }}</label>
      <button class="rounded bg-pink-500 px-4 py-2 text-white">{{ _('common.add') }}</button>
    </form>
    <template x-for="subscription in subscriptions" :key="subscription.id">
      <div class="flex gap-3 justify-between border-t mt-3 pt-3 text-sm">
        <span x-text="subscription.event_type + ' · ' + (subscription.repo_name || '*') + ' · ' + subscription.min_severity + ' → ' + (endpoints.find(endpoint => endpoint.id === subscription.endpoint_id)?.name || {{ _('notification_center.web_inbox') | tojson | forceescape }}) + (subscription.enabled ? '' : ' [off]')"></span>
        <button type="button" class="text-red-600" @click="removeRule(subscription.id)">{{ _('common.delete') }}</button>
      </div>
    </template>
  </div>
</section>
<script>
function notificationPreferences() {
  return {
    endpoints: [], providers: [], eventTypes: [], subscriptions: [], feedback: '',
    newEndpoint: {provider: 'email', name: '', address: '', signing_secret: ''},
    rule: {event_type: '*', endpoint_id: '', repo_name: '', min_severity: 'info', resource_type: '', resource_id: '', enabled: true},
    async request(path, method = 'GET', body) {
      const response = await fetch('/notifications' + path, {method, headers: {'Content-Type': 'application/json', 'X-CSRF-Token': {{ csrf_token | tojson }}}, body: body === undefined ? undefined : JSON.stringify(body)});
      if (!response.ok) { this.feedback = {{ _('notification_center.operation_failed') | tojson }}; return null; }
      this.feedback = method === 'GET' ? this.feedback : {{ _('notification_center.saved') | tojson }};
      return await response.json();
    },
    async load() { const data = await this.request('/settings'); if (data) { this.endpoints = data.endpoints; this.providers = data.providers; this.eventTypes = data.event_types; this.subscriptions = data.subscriptions; } },
    async addEndpoint() { const data = await this.request('/endpoints', 'POST', this.newEndpoint); if (data) { this.newEndpoint = {provider: 'email', name: '', address: '', signing_secret: ''}; await this.load(); } },
    async saveEndpoint(endpoint) { const body = {name: endpoint.name, enabled: endpoint.enabled}; if (endpoint.newSecret) body.signing_secret = endpoint.newSecret; if (await this.request('/endpoints/' + endpoint.id, 'PATCH', body)) await this.load(); },
    async sendTest(endpoint) { if (await this.request('/endpoints/' + endpoint.id + '/test', 'POST', {})) this.feedback = {{ _('notification_center.test_queued') | tojson }}; },
    async checkStatus(endpoint) { const data = await this.request('/endpoints/' + endpoint.id + '/status'); endpoint.deliveryStatus = data?.deliveries?.[0] ? data.deliveries[0].status + ' · ' + (data.deliveries[0].category || '') : {{ _('notification_center.awaiting_dispatch') | tojson }}; },
    async verify(endpoint) { if (await this.request('/endpoints/' + endpoint.id + '/verify', 'POST', {code: endpoint.code || ''})) { this.feedback = {{ _('notification_center.verification_sent') | tojson }}; await this.load(); } },
    async unbind(endpoint) { if (await this.request('/endpoints/' + endpoint.id, 'DELETE')) await this.load(); },
    async addRule() { const body = {...this.rule, endpoint_id: this.rule.endpoint_id ? Number(this.rule.endpoint_id) : null, repo_name: this.rule.repo_name || null, resource_type: this.rule.resource_type || null, resource_id: this.rule.resource_id || null}; if (await this.request('/subscriptions', 'POST', body)) await this.load(); },
    async removeRule(id) { if (await this.request('/subscriptions/' + id, 'DELETE')) await this.load(); }
  };
}
</script>
