{% from "components/modal.html" import modal_shell %}

{% macro render(csrf_token) %}
<div>
    <!-- 触发按钮 -->
    <button @click="Sakura.openModal('add-user-modal')"
            class="px-4 py-2 bg-pink-500 text-white rounded-lg text-sm font-medium hover:bg-pink-600 transition-colors inline-flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
        </svg>
        {{ _('user.add_user') }}
    </button>

    <!-- Modal（统一组件） -->
    {% call modal_shell(id="add-user-modal", title=_('user.add_user'), size="lg", close_sr=_('common.close')) %}
            <form method="POST" action="/users/add">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <!-- 基本信息 -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Telegram ID <span class="text-xs text-gray-400">({{ _('common.optional') }})</span>
                        </label>
                        <input type="number" name="telegram_id" min="1"
                               class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none"
                               placeholder="{{ _('user.telegram_id') }}">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            GitHub {{ _('common.name') }} <span class="text-red-500">*</span>
                        </label>
                        <input type="text" name="github_username" required
                               class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none"
                               placeholder="{{ _('user.github_id') }}">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ _('user.role') }}</label>
                        <select name="role"
                                class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none">
                            <option value="user">{{ _('user.roles.user') }}</option>
                            <option value="admin">{{ _('user.roles.admin') }}</option>
                            <option value="super_admin">{{ _('user.roles.super_admin') }}</option>
                        </select>
                    </div>
                </div>

                <!-- PR 审查配额 -->
                <div class="mt-6 pt-4 border-t border-gray-200 dark:border-gray-700">
                    <h3 class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">PR {{ _('user.quota') }}</h3>
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">{{ _('user.daily_quota') }}</label>
                            <input type="number" name="daily_quota" value="10" min="0"
                                   class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">{{ _('user.weekly_quota') }}</label>
                            <input type="number" name="weekly_quota" value="50" min="0"
                                   class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">{{ _('user.monthly_quota') }}</label>
                            <input type="number" name="monthly_quota" value="200" min="0"
                                   class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none">
                        </div>
                    </div>
                </div>

                <!-- Issue 分析配额 -->
                <div class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
                    <h3 class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">Issue {{ _('user.quota') }}</h3>
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">{{ _('user.daily_quota') }}</label>
                            <input type="number" name="issue_daily_quota" value="20" min="0"
                                   class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">{{ _('user.weekly_quota') }}</label>
                            <input type="number" name="issue_weekly_quota" value="80" min="0"
                                   class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">{{ _('user.monthly_quota') }}</label>
                            <input type="number" name="issue_monthly_quota" value="300" min="0"
                                   class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none">
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="mt-6 flex justify-end gap-3">
                    <button type="button" @click="Sakura.closeModal('add-user-modal')"
                            class="px-4 py-2 rounded-lg text-sm font-medium border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors">
                        {{ _('common.cancel') }}
                    </button>
                    <button type="submit"
                            class="px-4 py-2 bg-pink-500 hover:bg-pink-600 text-white rounded-lg text-sm font-medium transition-colors">
                        {{ _('user.add_user') }}
                    </button>
                </div>
            </form>
    {% endcall %}
</div>
{% endmacro %}
