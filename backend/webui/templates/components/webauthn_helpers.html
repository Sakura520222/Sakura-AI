<script>
function base64urlToBuffer(value) {
    const padding = '='.repeat((4 - value.length % 4) % 4);
    const base64 = (value + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    const buffer = new ArrayBuffer(raw.length);
    const view = new Uint8Array(buffer);
    for (let i = 0; i < raw.length; i++) view[i] = raw.charCodeAt(i);
    return buffer;
}
function bufferToBase64url(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = '';
    for (const byte of bytes) binary += String.fromCharCode(byte);
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}
function isWebAuthnUserCancel(error) {
    return error.name === 'NotAllowedError';
}
function classifyWebAuthnError(error, i18n) {
    if (!error) return i18n.passkey_failed || 'Passkey operation failed';
    if (isWebAuthnUserCancel(error)) return null;
    const msg = (error.message || '').toLowerCase();
    if (msg.includes('credential manager') || msg.includes('credentialmanager')) {
        return i18n.passkey_credential_manager_error || 'Unable to communicate with the credential manager. Please try using the built-in password manager (e.g. Google Password Manager) or a hardware security key.';
    }
    if (error.name === 'SecurityError') {
        return i18n.passkey_security_error || 'Passkey security error. Please ensure the site is accessed over HTTPS with the correct domain.';
    }
    if (error.name === 'InvalidStateError') {
        return i18n.passkey_already_registered || 'This authenticator has already been registered.';
    }
    if (error.name === 'NotSupportedError') {
        return i18n.passkey_not_supported || 'This browser does not support passkeys.';
    }
    return i18n.passkey_failed || 'Passkey operation failed';
}
</script>
