<!DOCTYPE html>
<html lang="{{ lang }}" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - Sakura AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sakura: {
                            50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 300: '#f9a8d4',
                            400: '#f472b6', 500: '#ec4899', 600: '#db2777', 700: '#be185d',
                            800: '#9d174d', 900: '#831843', 950: '#500724',
                        },
                    },
                    fontFamily: {
                        sans: ['"Inter"', 'system-ui', '-apple-system', '"Segoe UI"', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    </script>
    <style>
        {% include "components/sakura_theme_css.html" %}
    </style>
</head>
<body class="sakura-gradient-bg min-h-screen font-sans flex flex-col">
    <!-- 导航栏 -->
    <nav class="h-16 glass border-b border-sakura-200/50 dark:border-sakura-800/30 px-4 lg:px-6 flex items-center justify-between shadow-sm">
        <a href="/" class="flex items-center gap-2 group">
            <span class="text-2xl transition-transform duration-300 group-hover:scale-110">🌸</span>
            <span class="font-bold text-lg hidden sm:inline bg-gradient-to-r from-sakura-600 to-sakura-800 dark:from-sakura-400 dark:to-sakura-300 bg-clip-text text-transparent">Sakura AI</span>
        </a>
        <div class="flex items-center gap-3">
            <a href="/pricing" class="text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-sakura-600 dark:hover:text-sakura-400 transition-colors">Pricing</a>
            <a href="/terms" class="text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-sakura-600 dark:hover:text-sakura-400 transition-colors">Terms</a>
            <a href="/privacy" class="text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-sakura-600 dark:hover:text-sakura-400 transition-colors">Privacy</a>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="flex-1 max-w-4xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
        <div class="glass rounded-2xl shadow-xl border border-sakura-200/50 dark:border-sakura-800/30 p-6 sm:p-10">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="border-t border-sakura-200/50 dark:border-sakura-800/30 py-8 px-4">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-gray-500 dark:text-gray-400">
            <div class="flex items-center gap-2">
                <span>🌸</span>
                <span>&copy; 2026 Sakura AI. All rights reserved.</span>
            </div>
            <div class="flex flex-wrap items-center justify-center gap-x-5 gap-y-2">
                <a href="/terms" class="hover:text-sakura-600 dark:hover:text-sakura-400 transition-colors">Terms of Service</a>
                <a href="/privacy" class="hover:text-sakura-600 dark:hover:text-sakura-400 transition-colors">Privacy Policy</a>
                <a href="/refund" class="hover:text-sakura-600 dark:hover:text-sakura-400 transition-colors">Refund Policy</a>
                <a href="/pricing" class="hover:text-sakura-600 dark:hover:text-sakura-400 transition-colors">Pricing</a>
            </div>
        </div>
    </footer>
</body>
</html>
