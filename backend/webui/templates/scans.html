{% extends "base.html" %}

{% block title %}{{ _('scan.title') }} - Sakura AI Reviewer{% endblock %}

{% block content %}
<div class="space-y-4">
    <!-- 页面标题 -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold">{{ _('scan.title') }}</h1>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ _('scan.description') }}</p>
        </div>
        <button onclick="triggerScan()"
                class="inline-flex items-center gap-2 px-4 py-2 bg-pink-500 hover:bg-pink-600 text-white text-sm font-medium rounded-lg transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            {{ _('scan.trigger_scan') }}
        </button>
    </div>

    <!-- 统计卡片 -->
    <div id="scan-stats-container" hx-get="/scans/stats" hx-trigger="load" hx-swap="innerHTML">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
                <div class="animate-pulse h-4 bg-gray-200 dark:bg-gray-700 rounded w-20 mb-2"></div>
                <div class="animate-pulse h-8 bg-gray-200 dark:bg-gray-700 rounded w-12"></div>
            </div>
        </div>
    </div>

    <!-- 扫描列表（通过 HTMX 加载） -->
    <div id="scan-list-container" hx-get="/scans/list-fragment" hx-trigger="load" hx-swap="innerHTML">
        <div class="text-center py-8 text-gray-400">
            <svg class="w-8 h-8 mx-auto animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            <p class="mt-2"><script>document.write(_t('loading'))</script></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
{{ super() }}
<script>
var loadPage = function(n) { loadListPage('scan-list-container', '/scans/list-fragment', n); };
initFilterForm('scan-filter-form', 'scan-list-container', '/scans/list-fragment');

function triggerScan() {
    if (!confirm('{{ _('scan.confirm_trigger') }}')) return;
    fetch('/scans/trigger', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRF-Token': '{{ csrf_token }}'}
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            window.dispatchEvent(new CustomEvent('show-toast', {
                detail: {message: data.message, type: 'success', duration: 3000}
            }));
            setTimeout(() => htmx.trigger('scan-list-container', 'load'), 2000);
        } else {
            window.dispatchEvent(new CustomEvent('show-toast', {
                detail: {message: data.message, type: 'error', duration: 3000}
            }));
        }
    })
    .catch(e => {
        window.dispatchEvent(new CustomEvent('show-toast', {
            detail: {message: '触发扫描失败: ' + e, type: 'error', duration: 3000}
        }));
    });
}
</script>
{% endblock %}
