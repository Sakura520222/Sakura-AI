{% extends "base.html" %}

{% block title %}{{ _('github_app.title') }} - Sakura AI{% endblock %}

{% block content %}
<div class="space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
            <h1 class="text-2xl font-bold">{{ _('github_app.title') }}</h1>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                {{ _('github_app.subtitle') }}
            </p>
        </div>
        <button type="button"
                hx-get="/github-app/list-fragment?refresh=true"
                hx-target="#github-app-list-container"
                hx-swap="innerHTML"
                class="inline-flex items-center gap-2 rounded-lg border border-gray-300 px-4 py-2 text-sm transition-colors hover:bg-gray-50 dark:border-gray-600 dark:hover:bg-gray-700">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            {{ _('common.refresh') }}
        </button>
    </div>
    <div id="github-app-list-container">
        {% include "components/github_app_list_fragment.html" %}
    </div>
</div>
{% endblock %}
