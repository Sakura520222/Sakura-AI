<section class="mt-8 rounded-xl border p-5 space-y-4" x-data="notificationHistory()" x-init="load()">
  <div class="flex justify-between items-center gap-3">
    <h2 class="text-lg font-semibold">{{ _('notification_center.history') }} <span class="text-pink-600" x-text="unread"></span></h2>
    <button type="button" class="text-sm text-pink-600" @click="readAll()">{{ _('announcements.mark_all_read') }}</button>
  </div>
  <p class="text-sm text-gray-500" x-show="!items.length">{{ _('notification_center.empty') }}</p>
  <p class="text-sm text-red-600" role="status" x-text="feedback"></p>
  <template x-for="item in items" :key="item.id">
    <article class="rounded-lg border p-4 space-y-2" :class="item.read ? '' : 'border-pink-300 bg-pink-50/30 dark:bg-pink-900/10'">
      <div class="flex justify-between gap-3"><h3 class="font-medium" x-text="item.title"></h3><span class="text-xs text-gray-500" x-text="item.severity"></span></div>
      <p class="text-sm whitespace-pre-wrap" x-text="item.content"></p>
      <div class="flex justify-between text-sm"><time class="text-xs text-gray-500" x-text="item.occurred_at"></time><a x-show="item.detail_url" :href="item.detail_url" class="text-pink-600" @click="read(item.id)">{{ _('notification_center.details') }}</a><button type="button" x-show="!item.read" class="text-pink-600" @click="read(item.id)">{{ _('notification_center.mark_read') }}</button></div>
    </article>
  </template>
  <div class="flex gap-3 text-sm"><button type="button" :disabled="page === 1" @click="page--; load()">{{ _('common.prev_page') }}</button><span x-text="page"></span><button type="button" :disabled="!hasNext" @click="page++; load()">{{ _('common.next_page') }}</button></div>
  {% if current_user.role == 'super_admin' %}
  <details class="border-t pt-4" @toggle="if ($el.open) diagnostics()">
    <summary class="cursor-pointer font-medium">{{ _('notification_center.diagnostics') }}</summary>
    <div class="mt-3 text-sm space-y-2">
      <template x-for="provider in admin.providers || []" :key="provider.channel"><div><span x-text="provider.channel"></span> · <span x-text="provider.rate_limit_scope"></span></div></template>
      <template x-for="(count, index) in admin.counts || []" :key="index"><p x-text="count.channel + ' · ' + count.status + ' · ' + (count.category || '') + ': ' + count.count"></p></template>
      <template x-for="event in admin.events || []" :key="event.id"><p x-text="event.type + ' · ' + event.status + ' · ' + (event.category || '')"></p></template>
      <template x-for="delivery in admin.deliveries || []" :key="delivery.id"><div class="flex flex-wrap gap-3"><span x-text="'#' + delivery.id + ' · ' + delivery.channel + ' · ' + delivery.status + ' · ' + (delivery.category || '') + ' · ' + delivery.attempts"></span><button type="button" class="text-pink-600" x-show="delivery.status === 'failed'" @click="retry(delivery.id)">{{ _('notification_center.retry') }}</button></div></template>
      <details><summary>{{ _('notification_center.audit') }}</summary><template x-for="(entry, index) in admin.audit || []" :key="index"><p x-text="entry.at + ' · ' + entry.action + ' · ' + entry.target_id"></p></template></details>
    </div>
  </details>
  {% endif %}
</section>
<script>
function notificationHistory() {
  return {
    items: [], page: 1, hasNext: false, unread: 0, admin: {}, feedback: '',
    async request(path, method = 'GET') { const response = await fetch('/notifications' + path, {method, headers: {'X-CSRF-Token': {{ csrf_token | tojson }}}}); if (!response.ok) { this.feedback = {{ _('notification_center.operation_failed') | tojson }}; return null; } return await response.json(); },
    async load() { const data = await this.request('/history?page=' + this.page); if (data) { this.items = data.items; this.hasNext = data.has_next; this.unread = data.unread; } },
    async read(id) { if (await this.request('/' + id + '/read', 'POST')) await this.load(); },
    async readAll() { if (await this.request('/read-all', 'POST')) await this.load(); },
    async diagnostics() { const data = await this.request('/admin/diagnostics'); if (data) this.admin = data; },
    async retry(id) { if (await this.request('/admin/deliveries/' + id + '/retry', 'POST')) await this.diagnostics(); }
  };
}
</script>
