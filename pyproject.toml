[project]
name = "sakura-ai"
version = "0.1.0"
description = "GitHub PR/Issue AI review bot (FastAPI / SQLAlchemy async / MySQL / Redis / ChromaDB)"
readme = "README.md"
authors = [
    { name = "sakura520222", email = "sakura520222@outlook.com" }
]
requires-python = ">=3.14"
# 依赖与 requirements.txt 逐条一致(pip/Docker 构建的权威来源);
# 同步由 tests/test_uv_pyproject.py 强制校验。
# Dependencies mirror requirements.txt line by line (authoritative source for
# pip/Docker builds); the sync is enforced by tests/test_uv_pyproject.py.
dependencies = [
    # Web框架
    "fastapi>=0.141.1,<1.0.0",
    "starlette>=1.7.0,<2.0.0",
    "uvicorn[standard]>=0.53.0",
    "python-multipart>=0.0.32",

    # GitHub集成
    "PyGithub>=2.10.0",
    "cryptography>=50.0.1",

    # AI集成
    "openai>=3.8.0",
    "httpx>=0.28.1",

    # 数据库
    "sqlalchemy[asyncio]>=2.1.0,<2.2",
    "asyncmy>=0.2.15",
    "asyncpg>=0.31.0",
    "alembic>=1.19.2",

    # 任务队列
    "redis>=8.1.0",
    "APScheduler>=3.11.3",

    # 工具库
    "typing-extensions>=4.16.0",
    "pyyaml>=6.0.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "Pillow>=12.3.0",
    "tzlocal==5.4.4",
    "tzdata==2026.4",

    # 日志
    "loguru>=0.7.3",

    # Telegram Bot
    "python-telegram-bot>=22.8",

    # RAG 功能
    "chromadb>=1.5.9",
    "watchfiles>=1.2.0",
    "python-slugify>=9.1.1",

    # 支付网关
    "stripe>=15.6.1",
    "paddle-python-sdk>=1.15.0",

    # WebUI
    "jinja2>=3.1.6",
    "python-jose[cryptography]>=3.5.0",
    "itsdangerous>=2.2.0",
    "pyotp>=2.10.0",
    "qrcode[pil]>=8.2",
    "webauthn>=3.0.1",

    # API 限流
    "slowapi>=0.1.10",

    # URL 抓取与网络搜索工具
    "beautifulsoup4>=4.15.0",
    "duckduckgo-search>=8.1.1",

    # Agent 专家团队常用验证工具
    "ruff>=0.16.9",
    "pytest>=9.1.1",
]

[dependency-groups]
# 根测试套件递归发现 updater/tests,需要 updater 可导入且自带测试依赖
# (pytest-asyncio / httpx);与 pip 流程的 `pip install -e './updater[dev]'` 对应。
# The root test suite discovers updater/tests recursively, so updater must be
# importable with its own test deps (pytest-asyncio / httpx); mirrors
# `pip install -e './updater[dev]'` from the pip workflow.
dev = [
    "sakura-ai-updater[dev]",
]

[tool.uv]
# 应用以 `python -m backend.main` 运行,不构建/安装根项目(虚拟项目)。
# The app runs via `python -m backend.main`; the root project is virtual
# (never built/installed).
package = false

# 锁文件覆盖的源码开发平台:Windows、Linux x86_64/aarch64(glibc ≥ 2.28、非 musl)
# 与 Apple Silicon macOS。
# PyPI 实测:当前锁定的 onnxruntime 1.29.0(chromadb 的硬依赖)已提供
# Python 3.14 的 Windows、macosx_14_0_arm64 与 manylinux_2_28 wheel 且无
# sdist;因此 Intel Mac / macOS ≤13 / musl(Alpine)/ glibc <2.28 无法安装依赖
# (pip 同样失败),不在锁文件覆盖范围。
# The locked source-development platforms: Windows, Linux x86_64/aarch64
# (glibc >= 2.28, non-musl), and Apple Silicon macOS. Verified against PyPI:
# the locked onnxruntime 1.29.0 (a hard chromadb dependency) provides Python
# 3.14 wheels for Windows, macosx_14_0_arm64, and manylinux_2_28 with no sdist.
# Intel Macs, macOS <=13, musl (Alpine), and glibc <2.28 cannot install the
# dependencies (pip fails the same way) and are out of the lockfile's scope.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
sakura-ai-updater = { path = "updater", editable = true }
